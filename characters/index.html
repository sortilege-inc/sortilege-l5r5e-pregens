<div class="wrap">
  <header class="masthead">
    <div class="cartouche">
      <div class="eyebrow">The Roster</div>
      <h1>Characters</h1>
    </div>
    <p class="sub">Each is a complete build at every XP tier it has reached. Open one and use the timeline to move through its career.</p>
    <div class="sb-go" style="justify-content:center;margin-top:1.1rem">
      <a class="btn big" href="../creator/index.html?new=1">Build a samurai</a>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name, school, clan, family…">
    <label for="clan">Clan</label>
    <select id="clan"><option value="">All</option></select>
    <label for="role">Role</label>
    <select id="role"><option value="">All</option></select>
    <label for="campaign">Campaign</label>
    <select id="campaign"><option value="">All</option></select>
    <label class="tog" for="published">
      <input type="checkbox" id="published">
      <span>Published pregens</span>
    </label>
    <span class="chip" id="shown"></span>
  </div>

  <div class="pgrid" id="roster"></div>
</div>

<footer class="foot"><span class="mark">❖</span>Sortilege · Legend of the Five Rings 5th Edition</footer>

<script src="../data/roster.js?v=1e5def76"></script>
<script src="../data/campaigns.js?v=36715bfa"></script>
<script src="../assets/roster.js?v=2cefdb59"></script>
<script>
(function () {
  var chars = window.L5R_ROSTER || [];
  var q = document.getElementById("q"),
      clan = document.getElementById("clan"),
      role = document.getElementById("role"),
      campaign = document.getElementById("campaign");

  function esc(x) {
    return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
               "'": "&#39;" }[c];
    });
  }
  var published = document.getElementById("published");
  // Two kinds of character live here. The archive is the work — one build per
  // school, ours. The published pregens are the folios FFG shipped with the
  // Beginner Game and the Gen Con adventures, transcribed verbatim: useful to
  // hand to a player, but not ours and not what the coverage count is about.
  // So they are off by default and the toggle says how many are waiting.
  var mine = chars.filter(function (c) { return c.provenance !== "published"; });
  var pubs = chars.filter(function (c) { return c.provenance === "published"; });
  /* The campaign filter reads the declared list rather than what the
     characters happen to carry, so a campaign nobody has built for yet still
     appears — with its count, and with the reason it is empty when you pick
     it. Clan and role stay observed: there is no sense in offering a clan that
     nothing in view belongs to. */
  var CAMPAIGNS = window.L5R_CAMPAIGNS || [];
  var CAMPAIGN_BY_NAME = {};
  CAMPAIGNS.forEach(function (c) { CAMPAIGN_BY_NAME[c.name] = c; });

  function fillCampaigns() {
    var was = campaign.value;
    while (campaign.options.length > 1) campaign.remove(1);
    CAMPAIGNS.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.name;
      o.textContent = c.name + (c.characters ? " (" + c.characters + ")"
                                             : " — none yet");
      campaign.appendChild(o);
    });
    if (was && CAMPAIGN_BY_NAME[was]) campaign.value = was;
  }

  // the option lists follow whichever set is on screen, so turning the pregens
  // on does not leave a clan in the dropdown that nothing in view has
  function fillAll(pool) {
    [clan, role].forEach(function (sel) {
      var was = sel.value;
      while (sel.options.length > 1) sel.remove(1);
      sel.value = "";
      var key = sel.id;
      var vals = {};
      pool.forEach(function (c) { if (c[key]) vals[c[key]] = 1; });
      Object.keys(vals).sort().forEach(function (v) {
        var o = document.createElement("option");
        o.value = o.textContent = v;
        sel.appendChild(o);
      });
      if (was && vals[was]) sel.value = was;
    });
  }

  function draw() {
    var pool = published.checked ? chars : mine;
    var term = q.value.trim().toLowerCase();
    var list = pool.filter(function (c) {
      if (clan.value && c.clan !== clan.value) return false;
      if (role.value && c.role !== role.value) return false;
      if (campaign.value && c.campaign !== campaign.value) return false;
      if (!term) return true;
      return [c.name, c.school, c.clan, c.family, c.role, c.campaign, c.product]
        .join(" ").toLowerCase().indexOf(term) >= 0;
    });
    // Edit, +XP and Legacy under each card: this is the roster, where someone
    // comes to do something with a character they already have. renderRoster
    // withholds them from a published pregen, whose record the importer owns.
    // A declared campaign with nothing in it is a thing to set up, not a bug.
    // Saying which and why beats an empty grid: the note is where the source
    // is known to be missing.
    var picked = CAMPAIGN_BY_NAME[campaign.value];
    document.getElementById("roster").innerHTML =
      (!list.length && picked && !picked.characters
        ? '<div class="campaign-empty"><p class="muted"><strong>' +
          esc(picked.name) + "</strong> has no characters yet." +
          (picked.note ? " " + esc(picked.note) : "") + "</p>" +
          // the shortlist, so the plan is where the empty pack is rather than
          // only in the manifest
          ((picked.pencilled || []).length
            ? '<p class="ce-pencilled"><span class="ce-label">Pencilled in</span>' +
              picked.pencilled.map(function (p) {
                return "<span" + (p.covered ? ' class="ce-taken"' : "") +
                  ' title="' + (p.covered
                    ? "the archive has already built a character to this school"
                    : "not yet built anywhere in the archive") + '">' +
                  esc(p.school) + "</span>";
              }).join("") + "</p>"
            : "") +
          (picked.pencilled_why
            ? '<p class="muted small ce-why">' + esc(picked.pencilled_why) + "</p>"
            : "") + "</div>"
        : window.renderRoster(list, "", { actions: true }));
    document.getElementById("shown").textContent =
      list.length + " of " + pool.length;
  }
  published.nextElementSibling.textContent =
    pubs.length ? "Published pregens (" + pubs.length + ")" : "Published pregens";
  if (!pubs.length) published.closest("label").hidden = true;
  fillAll(mine);
  fillCampaigns();
  published.addEventListener("change", function () {
    fillAll(published.checked ? chars : mine);
    draw();
  });
  [q, clan, role, campaign].forEach(function (e) { e.addEventListener("input", draw); });
  draw();
})();
</script>
</body>
</html>
