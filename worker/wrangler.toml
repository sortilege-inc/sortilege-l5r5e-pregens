name = "sortilege-l5r-creator-ai"
main = "src/index.js"
compatibility_date = "2026-08-29"

# Serve at <name>.<subdomain>.workers.dev. This defaults to true, but stating it
# makes the route part of the deploy rather than something that has to already
# be attached — a Worker can exist, with its secret set, and still answer 404
# (Cloudflare error 1042) if no route points at it.
workers_dev = true

# The shared draft store. `database_id` is filled in by scripts/deploy_worker.sh
# the first time it runs, from `wrangler d1 create`; the placeholder is what
# `wrangler dev --local` binds against, where the id is only a local key.
[[d1_databases]]
binding = "DB"
database_name = "sortilege-l5r-drafts"
database_id = "0893d9cf-ce4e-4e19-8053-a29fd8f86888"

[vars]
# Comma-separated origins allowed to call this Worker. The first is the
# fallback CORS origin. The Creator is served from GitHub Pages; keep the
# localhost entry for the local preview server (scripts note: python3 -m
# http.server 8412).
ALLOWED_ORIGIN = "https://sortilege-inc.github.io,http://localhost:8412"

# The only model this Worker will call, and the ceiling it will allow. The
# Worker is not a general-purpose LLM endpoint: it exists to answer one
# narrative field at a time for the character creator.
MODEL = "claude-haiku-4-5-20251001"
MAX_TOKENS = "400"

# Per-IP rate limits, requests per minute, counted separately per route.
# Suggestions are one-at-a-time and human-paced; anything faster is not a person
# filling in a character sheet. Draft syncing is an autosave plus a poll, so it
# is legitimately much chattier and needs its own allowance.
RATE_PER_MIN = "12"
SYNC_PER_MIN = "120"

# ANTHROPIC_API_KEY and TABLE_KEY are SECRETS and are deliberately absent from
# this file. Set them yourself, from your own shell:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TABLE_KEY
