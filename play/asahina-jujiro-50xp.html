  {
   "name": "Armor of Radiance",
   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Oil of Awakening Flames (Alchemy), Armor of Osano-wo (Ancestral), Robes of the Ifrit (Foreign)</p><p><em>By appealing to the fire kami that slumber within an object, a shugenja can turn a set of armor into a weapon. The fire kami’s creative energy expands rapidly as the incantation ends, causing shimmering radiance to burst forth into a halo of fire that encircles the armor and the wearer, searing their foes.</em></p><p><strong>Activation:</strong> As a Support action, you may make a TN 2 Theology (fire) check targeting one set of armor at range 0–1.</p><p><strong>Effects:</strong> If you succeed, you augment the target armor, enveloping it in blinding radiance and searing heat (that miraculously do not affect the wearer). When a character at range 0–1 of the wearer begins their turn, they suffer the Burning and Dazed conditions. This effect persists for one round, plus additional rounds equal to your bonus successes.</p><h4>New Opportunities</h4><p>(fire)(op): The armor gains the Wargear quality.</p><p>(fire)(op)(op): This effect persists until the end of the scene instead.</p>"

  {

   "text": "<p>Smoke of Stolen Light (Alchemy), Shroud of the North Wind (Fortunist), Walk in the Shadow World (Foreign)</p><p><em>A sufficiently learned shugenja can call forth air kami to play one of their simplest and most effective tricks: enveloping an object or person in their embrace to hide it from sight.</em></p><p><strong>Activation:</strong> As a Scheme and Support action, you may make a Theology (air) check targeting one object or character at range 0–1. The TN is equal to the target’s silhouette (see page 265).</p><p><strong>Effects:</strong> If you succeed, you augment the target with an illusion that renders it invisible to the naked eye. The object is still physically present and can be touched, smelled, or sensed with any normal sense other than vision. This effect persists for one round, plus additional rounds equal to your bonus successes.</p><h4>New Opportunities</h4><p>(air)(op)(op)+: Choose one additional target of the same silhouette or smaller per (op)(op) spent this way.</p>"

  {
   "name": "Path to Inner Peace",
   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Jurōjin's Kiss (Alchemy), Trancendence of Asako (Ancestral), Touch of the Hot Springs (Elemental)</p><p><em>By communing with the water kami that dwell within the body, a shugenja can right imbalances and correct the flow of ki, speeding the recovery of stamina dramatically.</em></p><p><strong>Activation:</strong> As a Support action, you may make a TN 2 Theology (water) check targeting yourself or another character at range 0–2.</p><p><strong>Effects:</strong> If you succeed, you mend your target’s exhausted muscles. The target removes fatigue equal to your Water Ring plus your bonus successes. Each target cannot be affected by the Path to Inner Peace invocation again until the end of the scene.</p><h4>New Opportunities</h4><p>(water)(op): Choose one of the following conditions: Bleeding, Dazed, Disoriented, or Lightly Wounded. Remove that condition from each target.</p><p>(water)(op): Your target also removes strife equal to your bonus successes.</p>"

  {
   "name": "Reflections of P’an Ku",
   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Agasha's Vast Wisdom (Ancestral), Rumors of the Water Kami (Elemental), Whispers of the Steel (Foreign)</p><p><em>Water kami are notoriously covetous, and things lost to the depths rarely resurface. Still, this avarice can offer advantages. A shugenja learned in this art can call forth water spirits to recognize an item by submerging it in sacred water. The water spirits often provide cryptic answers, but they usually can grant the shugenja a good idea of an item’s composition, whether it possesses any mystical properties, and the general disposition of these traits.</em></p><p><strong>Activation:</strong> As a Scheme action, you may make a TN 2 Theology (water) check targeting one item at range 0–1.</p><p><strong>Effects:</strong> If you succeed, you scry to uncover all properties an item possesses, including its name, maker, mundane qualities, magical properties, curses, and sealed techniques (see Nemuranai on page 307).</p><h4>New Opportunities</h4><p>(water)(op): Gain knowledge of the item’s origin in broad strokes, such as where it was forged, the clan of the individual who has carried it the longest, or a similar piece of information.</p><p>(water)(op): You may target a character instead of an object. If you succeed, you identify one invocation, kihō, mahō, or supernatural ability or item possessed by that person, along with its name and general qualities.</p><p></p>"

  {

   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Riddle of Agasha (Ancestral), Trick of the Air Kami (Elemental), Ebisu's Joke (Fortunist)</p><p><em>After performing this invocation, the shugenja conjures an illusion from the air, a trick of the light captured in hand.</em></p><p><strong>Activation:</strong> As a Scheme action, you may make a TN 2 Theology (air) check targeting one position at range 0–1.</p><p><strong>Effects:</strong> If you succeed, you summon an illusion of one inanimate object at the target position. The illusory object’s size is a silhouette of up to your bonus successes (beginning at 0, or a small handheld object). The item appears real, but it does not actually exist, and it cannot be used. Any character confronted with one of these illusions must resist with a TN 4 Artisan, Smithing, or Design check (Earth 5, Fire 2) using a Scholar skill approach to discern its illusory nature. The object persists until the end of the scene.</p><h4>New Opportunities</h4><p>(air)(op): The object can appear to be a creature or person (though it does not move).</p><p>(air)(op)+: Summon one additional illusory object in range per (op) spent this way.</p><p>(air)(op)(op): Illusory objects you summon this way have mass, and they can be used as if they were real (though they are still inanimate, and thus do not move on their own). They still vanish when the effect ends.</p>"

   "text": "<p><span class=\"fontstyle0\"><em>The ritualist sanctifies a person or group, anointing them with sacred substances that drive out unholy presences and malign sorcery.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 3 Theology (void) check </span><span class=\"fontstyle3\">targeting up to five characters to remove spiritual contaminants from the targets before they spread. Note that this cannot remove a Shadowlands Taint disadvantage once it has taken hold, but it can prevent this spiritual contamination from taking root after a character is exposed.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, remove the Afflicted condition from the target.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If one or more targets is an Otherworldly being, you become aware of it after completing the ritual—but you do not know which target.</span></p><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Choose one additional target per (op) spent this way.</span></p><p><span class=\"fontstyle2\">(void)(op)+: </span><span class=\"fontstyle3\">Instead of targeting characters, you may target an area that encompasses a number of range bands around you equal to (op) spent this way. Remove the Defiled terrain quality from this area. If it is a deeply unhallowed place that has long been the domain of evil, the Defiled quality returns after one day, plus additional days equal to your bonus successes.</span></p>"
  },
  {
   "name": "Commune with the Spirits",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist centers their mind on one of the Elements, appealing to the spirits in their environment and seeking their counsel or boon. Priests and laypeople are able to use this ritual to receive less specific guidance from the spirits, such as a leaf that falls to the ground pointing in the direction of the person or thing they are seeking.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity or Support action, you may make a </span><span class=\"fontstyle2\">TN 1 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) to appeal to nearby spirits of that Element (appeal to the departed, such as ancestor spirits, and other non-elemental supernatural presences, if using (void)) for aid.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, choose and receive one of the following boons from the spirit or spirits you contacted:</span></p><ul><li><p><span class=\"fontstyle2\">- Sense the Kami: </span><span class=\"fontstyle3\">Detect all spirits and uses of their magic by shugenja within a number of range bands equal to the ring you used plus your bonus successes.</span></p></li><li><p><span class=\"fontstyle2\">- Spiritual Knowledge: </span><span class=\"fontstyle3\">Learn one fact the spirits know about the area.</span></p></li><li><p><span class=\"fontstyle2\">- Elemental Gift: </span><span class=\"fontstyle3\">The kami deliver a small amount of the Element in question to you. For instance, a prayer to a water kami might cause it to begin raining lightly, for a short time, but it might also cause you to run across a stream, or even find groundwater. In contrast, a prayer to fire kami might bring forth a small shower of sparks, while a prayer to an air kami might elicit a gust of wind. Praying to an earth kami might cause you to stumble across a large stone, or find a small patch of arable ground amid a wasteland. Prayers to the ancestors may allow the petitioner to find something that belonged to an ancestor in a time of need.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Reduce the TN of your next check to interact with or appeal to kami or supernatural presences of this Element by 1.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed, receive one additional boon per </span><span class=\"fontstyle6\">(op) </span><span class=\"fontstyle3\">spent this way. Each boon can only be received one time per activation.</span></p>"
  },
  {
   "name": "Tea Ceremony",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>When Lady Doji served tea for the very first Emperor, the tea ceremony was born. Ceremony styles vary among the clans, from the gilded tea rooms of the Phoenix to the imperfect tea bowls of the Dragon, the early morning gatherings of the Crane to the snow- and moon-viewing ceremonies of the Scorpion. However, at its core the tea ceremony is fundamentally an appreciation of tea and, if done well, a spiritual moment for its participants. The tea represents all five elements: the fire used to heat the water, the earth from which the tea is grown, and the air that carries the aroma of the tea. Finally, void holds all four elements together, and brings in the mysterious fifth element, the moment of harmony and tranquility as one sips the tea.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session, as a downtime activity using a tea set, you may make a </span><span class=\"fontstyle2\">TN 2 Performance (void) check </span><span class=\"fontstyle3\">targeting yourself and a number of other characters up to your ranks in Culture, who are also participants. Up to one other participant may assist, providing the usual benefits (see </span><span class=\"fontstyle2\">Assistance </span><span class=\"fontstyle3\">on page 26).</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">Each target removes 3 strife, plus additional strife equal to your bonus successes.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Reduce the TN of each target’s next check by 1.</span></p><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle6\">+: </span><span class=\"fontstyle3\">Each target removes 1 fatigue, plus 1 fatigue per (op)</span><span class=\"fontstyle5\">(op) </span><span class=\"fontstyle3\">spent this way.</span></p><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle6\">: </span><span class=\"fontstyle3\">If you succeed, each target gains 1 Void point.</span></p>"
  },

   "text": "<p><span class=\"fontstyle0\">When making a check to mystically </span><span class=\"fontstyle2\">summon </span><span class=\"fontstyle0\">an illusion or to </span><span class=\"fontstyle2\">summon</span><span class=\"fontstyle0\">, </span><span class=\"fontstyle2\">augment</span><span class=\"fontstyle0\">, or </span><span class=\"fontstyle2\">awaken </span><span class=\"fontstyle0\">an object, you may add a number of kept (ring) set to (op) results equal to your school rank.</span></p>"

   "ring": "air",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>Daidoji Shingen sauntered down the gangplank from the dock to his waiting vessel, a broad smile spreading across his face. His crew gathered around their returning captain.</em></span></p><p><span class=\"fontstyle0\"><em>“We have safe harbor here, and a fine market in which to sell our cargo. Start offloading.” The crew cheered, and set to work. Shingen’s first mate, Hiramichi Anjiro, remained behind, scratching his head idly.</em></span></p><p><span class=\"fontstyle0\"><em>“I don’t know how you managed that, Captain.” Shingen winked. “Let’s just say that the lady of the palace was kindly disposed toward a wayward sea captain.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Benten’s Blessing distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- After interacting with a character for one or more scenes, you know with certainty whether they are open to your romantic aspirations or if they are categorically uninterested.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which the favor of the Fortune Benten is a benefit (such as an Aesthetics (air) check to say something insightful about a piece of art or a Courtesy (air) check to convince someone of your positive qualities), you may reroll up to two dice.</span></p></li></ul>"

  {
   "name": "Bitter Betrothal",
   "tag": "Adversity",
   "ring": "water",
   "kind": "adversity",
   "text": "<p><em>“My husband returns home tonight,” she said in a low whisper, passing the bag of coins beneath the table to the men seated across from her. Nobody in this inn knew her face, yet she still felt the need for caution. </em></p><p><em>“He will be traveling via the eastern road.”</em></p><p><em>“It shall be done,” said the leader. Without further word, he and his companions rose from the table and left the inn. The room seemed somehow lighter without them in it. Soon, she would be rid of him.</em></p><p></p><p>The following apply to a character with the Bitter Betrothal adversity</p><ul><li><p>- Something significantly complicates your relationship with your betrothed or spouse. As a result, they often undermine your efforts, whether out of malice, negligence, or an incompatible set of goals.</p></li><li><p>- When you make a check that requires the collaboration of your betrothed or spouse (such as a Courtesy (water) check to make a polite request to their family for political backing or a Culture (water) check to know the proper thing to do at a social function involving their relatives), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul><p></p>"
  },
  {
   "name": "Charity",
   "tag": "Passion",
   "ring": "water",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>“That’s a Crane samurai?!” Shōichirō said. “That one?! Whose clothes are torn and stained?”</em></span></p><p><span class=\"fontstyle0\"><em>Hina nodded. “Kakita Sakura. Said to have met the spirits of those she killed and her heart turned away from the blood and blade.”</em></span></p><p><span class=\"fontstyle0\"><em>“She still carries her katana, though.”</em></span></p><p><span class=\"fontstyle0\"><em>“Of course. She’s not stupid.” Hina shoved her friend toward Sakura, and the samurai turned and looked him straight in the eyes, her steely gaze never wavering.</em></span></p><p><span class=\"fontstyle0\"><em>“I-I-we-we.” Shōichirō fell to his knees, clutching at Sakura’s frayed coat. “Kakita-sama. My farms. My village. The soil is harsh and the weather poor. It’s as if the kami themselves are angry.”</em></span></p><p><span class=\"fontstyle0\"><em>Sakura plucked an ivory netsuke from her obi and pressed it into Shōichirō’s hands, while lifting him up. “Let’s find a merchant to pay a fair price for this. But promise me one thing.”</em></span></p><p><span class=\"fontstyle0\"><em>“Y-y-yes. Anything.”</em></span></p><p><span class=\"fontstyle0\"><em>“Take what money you need, but whatever you have left over, give to someone else in need.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Charity passion:</span></p><ul><li><p><span class=\"fontstyle3\">- Your charitable nature makes those who have witnessed or heard of your generosity more likely to accept your reasonable requests for aid, even if giving you aid does not directly benefit the other party.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check with which your charitable history is a benefit (such as a Courtesy (water) check to convince a peasant that you’re on their side or a Labor (water) check to determine the best way to benefit the most amount of people with your physical efforts), you remove 3 strife.</span></p></li></ul>"

  {
   "name": "Claustrophobia",
   "tag": "Anxiety",
   "ring": "water",
   "kind": "anxiety",
   "text": "<p><em>“We can escape through here!” Her companion pointed down the narrow, crowded, suffocating alleyway. Her heart beat against her chest. Her vision refused to focus on their escape.</em></p><p><em>“Go on ahead. I will fend them off.”</em></p><p><em>“You are outnumbered twelve to one!”</em></p><p><em>I understand swords, she thought. I under stand blood and death. Her companion slid his way through the alleyway as their pursuers rounded the corner. I hope I will live long enough to understand my fear.</em></p><p><strong>Effects:</strong> The following apply to a character with the Claustrophobia anxiety:</p><ul><li><p>-  You are intensely afraid of being enclosed in a small space or a space without an easy exit. You avoid entering such places if at all possible, and you feel anxious and distracted while in such a place.</p></li><li><p>-  After making a check that requires to you enter an enclosed space (such as a Fitness (water) check to crawl through a narrow passage or a Survival (water) check to investigate a cave), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"

   "tag": "Adversity",
   "ring": "earth",
   "kind": "adversity",
   "text": "<p><em>The next morning, as we prepared our horses for the long ride ahead, Moto Ryoichi was wracked by one of his coughing fits. As was his preference, I deliberately paid no attention, turning my gaze to the proper fitting of my mount’s reins. Out of the corner of my eye, however, I saw Ryoichi pull a white silk kerchief away from his mouth, spotted red with blood. My concern overcame our long-standing agreement. “Ryoichi-san.”</em></p><p><em>He waved away any further inquiry. “I’m fine,” he croaked, his throat raw from coughing. “We have a long day ahead. We should get on with it.”</em></p><p></p><p>The following apply to a character with the Incurable Illness adversity:</p><ul><li><p>- Periodically, if you push yourself too hard, you are afflicted by especially violent fits that significantly restrict your activity for a brief period of time.</p></li><li><p>- When you make a check to remain active for long periods of time (such as a Labor (earth) check to plow a field or a Survival (earth) check to build a shelter), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"

 "titles": [
  {
   "name": "Master Artisan",
   "text": "<p><span class=\"fontstyle0\">Once in a generation perhaps, a human’s art touches the divine, stirring the world itself with its clarity of purpose. There are numerous fables of Kakita artisans whose final masterworks changed the course of history, and every artist’s tradition claims some number whose works reached these heights, establishing their creators as masters among masters. The Sevenfold Palace is one location that produces some number of Master Artisans, but there are other schools and facilities in Rokugan whose students often lay claim to this title. To take on</span> <span class=\"fontstyle0\">the title of Master Artisan is to begin this elusive pursuit—to reach the realization that mastery of an art is not the end of their journey, but the beginning.</span></p><p><span class=\"fontstyle2\"><strong>Assigned By:</strong> </span><span class=\"fontstyle0\">Someone of status 75 or higher after the character performs a great artistic feat for them.</span></p><p><span class=\"fontstyle2\"><strong>Glory Award:</strong> </span><span class=\"fontstyle0\">+30 (to a maximum of 80)</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Inspired Creations</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Artisan Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Courtesy</p></td><td><p>Skill</p></td></tr><tr><td><p>Culture</p></td><td><p>Skill</p></td></tr><tr><td><p>Medicine</p></td><td><p>Skill</p></td></tr><tr><td><p>Meditation</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000043\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000043\">(shuji) All Arts Are One</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-rituals.Item.L5RCor
