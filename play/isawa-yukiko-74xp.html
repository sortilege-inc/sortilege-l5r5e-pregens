   "kind": "inversion",
   "text": "<p><em>The Void is nonexistence; therefore, within it, all possibilities exist. One who attunes their senses to nonexistence can perceive the other possible realities that ripple outward from each moment of action. The signs often do not come as complete visions, but as brief flashes: hazy vignettes of a world that never was. The rustling of leaves from a tree that has not yet grown, the first laugh shared with a new friend, the scent of blood and burning flesh. However, these rippling potential truths can become intoxicating, drawing an undisciplined mind deeper and deeper into twisted realms of refracted possibility until there is no escape. This is what those who study the Void call the “Lying Darkness”: the trap that awaits all who let their worldly desires guide their ventures into the Void.</em></p><p><strong>Activation:</strong> Once per session, immediately after you or another character at range 0–3 performs an action or makes a choice of great consequence in a narrative scene, you may make a TN 2 Theology (void) check targeting that character to peer beyond the lie of time and find another outcome.</p><p><strong>Effects:</strong> If you succeed, you scry for another outcome and return to the moment before the action was performed. All effects and outcomes stemming from the action are undone, but only you and the target are aware of the reality that no longer is. If you are the target, you may choose the same or a different action or decision. If another character is the target, you may say up to five words to the target before they act or make a decision.</p><h4>New Opportunities</h4><p>(op): If you target another character and you succeed, you may perform an action immediately before the target performs their new action.</p><h4>Magnitude</h4><p><strong>Magnitude 1+:</strong> You see one possible consequence of the original action or decision that would occur before the end of the scene.</p><p><strong>Magnitude 2+:</strong> You see one additional possible consequence of the original action or decision that would occur in the next year.</p><p><strong>Magnitude 3+:</strong> You see one additional possible consequence of the original action or decision that would occur in the next decades, or even further in the future.</p>"

   "ring": "fire",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>The childbirth assistant carried the silent bundle to the priest outside of the birthing chamber. The child’s grandmother followed with a stony look on her face.</em></span></p><p><span class=\"fontstyle2\"><em>Why isn’t the child crying? </em></span><span class=\"fontstyle0\"><em>the priest thought.</em></span></p><p><span class=\"fontstyle0\"><em>“Show him,” the grandmother said.</em></span></p><p><span class=\"fontstyle0\"><em>The assistant carefully unwrapped the bundle. The unnerving infant stared about, clear-eyed, as the grandmother pointed out the seven moles in a perfect circle on their ear.</em></span></p><p><span class=\"fontstyle0\"><em>“The child will reverse the family’s bad fortune!” the priest exclaimed. The grandmother let out a breath and smiled for the first time in years.</em></span></p><p></p><p><span class=\"fontstyle2\">The following apply to a character with the Portentous Birth distinction:</span></p><ul><li><p><span class=\"fontstyle2\">- You are known among your clan or family group to have been born under blessed circumstances or have had some sort of mark or other indication of greatness bestowed upon you by the Heavens. When you interact with someone who knows of your portentous birth and believes in its power, they treat you favorably and may be inclined to give you special privileges as long as you do not give them a reason to treat you otherwise.</span></p></li><li><p><span class=\"fontstyle2\">- When performing a check for which your fortuitous birth is an asset (such as a Composition (fire) check to craft a clever request to someone who believes in the legacy of your birth or a Theology (fire) check to theorize about an omen), you may reroll up to two dice.</span></p></li></ul>"

  {
   "name": "Awakened Soul",
   "text": "<p><span class=\"fontstyle0\">Most Rokugani believe in reincarnation, the passage of the soul into a new form after the death of the body. Shinseism in particular emphasizes the importance of reincarnation and the role it plays within the cosmology, but even among those who favor other religious traditions, few argue that existence ends at death. While the specifics of how and why reincarnation occurs vary by doctrine, most religious accounts agree that memory is erased upon death, in the afterlife, or during the process of the return to life.</span></p><p><span class=\"fontstyle0\">Yet some things can persist even across lifetimes. Some people are capable of connecting with the lives of past people, entities, and existences as an extension of their own being - beings that by all account seem to be their past lives. The Togashi Tattooed Order is one organization dedicated to those who again and again reincarnate and seek a particular destiny, but other spiritualists claim to have memories of their past lives as well, and the phenomenon can occur within individuals unrelated to any religious group.</span></p><p><span class=\"fontstyle0\">Memories of one's past lives generally begin murky, but may become clearer in physical proximity to individuals, artifacts, or places important to those beings. These visions and senses can be terrifying and disorienting at first, but when they occur, it is often of vital importance to both past and present self. Indeed, some work cannot be completed in a single lifetime.</span></p><p><span class=\"fontstyle2\"><strong>Assigned By:</strong> </span><span class=\"fontstyle0\">The GM. Even more than usual, this title is only available if it is narratively appropriate to the campaign.</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+0</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Wisdom of Countless Lifetimes</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Social Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Scholar Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Culture</p></td><td><p>Skill</p></td></tr><tr><td><p>Meditation</p></td><td><p>Skill</p></td></tr><tr><td><p>Survival</p></td><td><p>Skill</p></td></tr><tr><td><p>Theology</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-kiho.Item.L5RCoreKih000038\" data-pack=\"l5r5e.core-techniques-kiho\" data-type=\"Item\" data-id=\"L5RCoreKih000038\">(kiho) Eternal Mind’s Gate</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-rituals.Item.L5RCoreRit000035\" data-pack=\"l5r5e.core-techniques-rituals\" data-type=\"Item\" data-id=\"L5RCoreRit000035\">(ritual) Trance of Lives Past</a> (prereq)</p></td><td><p>Technique</p></td></tr></tbody></table>",
