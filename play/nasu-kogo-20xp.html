 "giri": "Her lord is Nasu Tadaaki, her own father and current head of the declining Nasu family. Her duty is to restore the family's status and influence with the Imperial families. Kogo must prove the Nasu worthy of their former position.",

   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Court is not a kind place, and a harsh word is no less cruel for being spoken softly and with perfect etiquette.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Scheme action, you may make a </span><span class=\"fontstyle2\">TN 1 Courtesy (air) check </span><span class=\"fontstyle3\">targeting a Compromised character.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your target must choose one of the following:</span></p><ul><li><p><span class=\"fontstyle3\">- Immediately unmask in a manner of their choosing based on the circumstances.</span></p></li><li><p><span class=\"fontstyle3\">- Forfeit glory equal to your Air Ring plus your bonus successes to leave the scene.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(air)</span><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle7\">+: </span><span class=\"fontstyle3\">If the target chooses to unmask, you learn one of their disadvantages of their choice per (op) spent this way.</span></p><p><span class=\"fontstyle2\">(air)</span><span class=\"fontstyle6\">(op)(op)</span><span class=\"fontstyle7\">: </span><span class=\"fontstyle3\">If the target chooses to leave the scene, you notice their destination from the direction of their departure or overhear from the crowd where they will retreat.</span></p>"

   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist centers their mind on one of the Elements, appealing to the spirits in their environment and seeking their counsel or boon. Priests and laypeople are able to use this ritual to receive less specific guidance from the spirits, such as a leaf that falls to the ground pointing in the direction of the person or thing they are seeking.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity or Support action, you may make a </span><span class=\"fontstyle2\">TN 1 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) to appeal to nearby spirits of that Element (appeal to the departed, such as ancestor spirits, and other non-elemental supernatural presences, if using (void)) for aid.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, choose and receive one of the following boons from the spirit or spirits you contacted:</span></p><ul><li><p><span class=\"fontstyle2\">- Sense the Kami: </span><span class=\"fontstyle3\">Detect all spirits and uses of their magic by shugenja within a number of range bands equal to the ring you used plus your bonus successes.</span></p></li><li><p><span class=\"fontstyle2\">- Spiritual Knowledge: </span><span class=\"fontstyle3\">Learn one fact the spirits know about the area.</span></p></li><li><p><span class=\"fontstyle2\">- Elemental Gift: </span><span class=\"fontstyle3\">The kami deliver a small amount of the Element in question to you. For instance, a prayer to a water kami might cause it to begin raining lightly, for a short time, but it might also cause you to run across a stream, or even find groundwater. In contrast, a prayer to fire kami might bring forth a small shower of sparks, while a prayer to an air kami might elicit a gust of wind. Praying to an earth kami might cause you to stumble across a large stone, or find a small patch of arable ground amid a wasteland. Prayers to the ancestors may allow the petitioner to find something that belonged to an ancestor in a time of need.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Reduce the TN of your next check to interact with or appeal to kami or supernatural presences of this Element by 1.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed, receive one additional boon per </span><span class=\"fontstyle6\">(op) </span><span class=\"fontstyle3\">spent this way. Each boon can only be received one time per activation.</span></p>"

   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Standing out in court requires a great deal of both cunning and flair, and standing out on purpose can be even harder. Courtiers train for much of their lives to learn to control the perceptions of others at court. The best courtiers know when to draw attention to themselves with a display of rhetorical prowess or another social feat and when to avoid attention. Drawing attention to oneself can give collaborators the chance to work unnoticed as well, and thus it is an extremely valuable tool in the courtier’s arsenal.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When making a Social skill (fire) check targeting one or more characters, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle4\">(fire)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">When interacting with other characters, the target treats their vigilance as 1 lower per (op) spent this way; when interacting with you, the target treats their vigilance as 1 higher per (op) spent this way. This effect persists until the end of the scene.</span></p>"

   "ring": "air",
   "kind": "adversity",
   "text": "<p><em>One of the more popular tales of the rakugoka, the professional storytellers of Rokugan, is that of the Artless Artist. A comedic tale, it is the story of a court artist who was utterly lacking in any genuine talent and had such an unpleasant demeanor that nobody would ever love him. The telling of the tale varies from performance to performance, with the rakugoka spinning unique and outrageous recountings of the artist’s misadventures tailored to the tastes of their particular audience.</em></p><p></p><p>The following apply to a character with the Benten’s Curse adversity:</p><ul><li><p>- Your romantic efforts are always stymied by circumstances, and your gestures to get the romantic attention of others are usually misinterpreted.</p></li><li><p>- When you make a check to express your admiration to someone (such as an Aesthetics (air) check to find the right poem to read to express your feelings or a Courtesy (air) check to tell someone your feelings without exceeding propriety), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"
