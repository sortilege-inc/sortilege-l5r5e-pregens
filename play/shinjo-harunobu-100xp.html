 "ninjo": "He feels constrained by courts and by command. He wants men under his own command, particularly after the debacle with the Lion.\n\n1. **He Disagrees with Kamoko but Must Obey**\n    - He believes **his strategies are often more sound**, but as long as **Kamoko holds authority**, he **must defer to her final decision**—even when he sees a mistake coming.\n    - He might **occasionally challenge her, but always within respectful bounds**—never outright defying her, though the temptation is there.\n2. **He Watches Kamoko Command and Thinks, ‘That Should Be Me.’**\n    - He respects Kamoko but **knows he is just as capable**—perhaps even more so, because he understands **both Unicorn and Crab military doctrines**.\n    - The **frustration of seeing an opportunity and being unable to seize it** gnaws at him.\n3. **He Feels Trapped by Loyalty**\n    - If Kamoko **relies on him so much**, why isn’t he **the one leading the armies**?\n    - He cannot **betray her or act dishonorably**, but his **own ambition remains unfulfilled**.\n4. **He Sees Court Politics as a Route to Power, But Refuses to Engage**\n    - The irony is that **a politically savvy samurai could maneuver themselves into a greater command**, but Harunobu **disdains courtly maneuvering**—which **keeps him locked in Kamoko’s shadow**.\n    - His **refusal to play the political game could be what’s preventing his rise**, but he still **sees politics as beneath him**.",
 "giri": "Utaku Kamoko\n\n1. **Strategic Commander in Utaku Kamoko’s Forces**\n    - Commands **a specialized force within the Unicorn army**, focusing on **long-term campaign planning and battlefield logistics**.\n    - **Directs defensive operations** when Kamoko’s usual fast-strike tactics need reinforcement.\n    - Trusted to **lead forces independently** when Kamoko must focus elsewhere.\n2. **Kamoko’s Personal Advisor**\n    - One of **the few people Kamoko trusts to challenge her ideas** without undermining her authority.\n    - Offers **alternative strategies** when pure cavalry charges won’t work.\n    - Helps Kamoko **anticipate enemy movements**, particularly against foes like the **Lion and Scorpion**, who rely on deception and layered tactics.\n3. **Crab Clan Liaison**\n    - Handles **military negotiations between the Unicorn and Crab**, ensuring both sides **coordinate effectively** in shared operations.\n    - Respected by **Crab commanders**, even if they see him as **too soft for having returned to the Unicorn**.\n    - Acts as a **buffer** when Unicorn cavalry tactics clash with the Crab’s **fortification and attrition warfare strategies**.\n    - Ensures that **Unicorn supply lines remain open** when dealing with the often blunt and inflexible Hida.",
 "money": "400 zeni",
 "techniques": [
  {
   "name": "Tactical Assessment",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Akodo’s </em></span><span class=\"fontstyle2\"><em>Leadership </em></span><span class=\"fontstyle0\"><em>and Bayushi’s </em></span><span class=\"fontstyle2\"><em>Lies </em></span><span class=\"fontstyle0\"><em>agree on a few topics, for both leaders were practical to a certain degree, even if Akodo famously scorned many of Bayushi’s methods. As the scholar Hida Fuyuko noted in her revelatory commentary on </em></span><span class=\"fontstyle2\"><em>Leadership</em></span><span class=\"fontstyle0\"><em>’s lessons for commanders on the Kaiu Wall, the most famous meeting of these two minds comes on the matter of preparation: battles are not won in the field, but in the leadup to the conflict. Even in small clashes, the warrior who better understands the terrain, the strength of their own forces, and the composition of the enemy’s troops is usually victorious.</em></span></p><p><span class=\"fontstyle3\"><strong>Activation:</strong> </span><span class=\"fontstyle2\">When you make an Initiative check, you may spend</span><span class=\"fontstyle4\"> (op) </span><span class=\"fontstyle2\">in the following way:</span></p><p><span class=\"fontstyle3\">(air)(op): </span><span class=\"fontstyle2\">Choose an enemy in the conflict. Learn one of their advantages (of their choice) and their physical or supernatural resistance (your choice).</span></p><p><span class=\"fontstyle3\">(earth)(op): </span><span class=\"fontstyle2\">Choose a character in the conflict. They do not apply any of their disadvantages to their checks until the end of their first turn.</span></p><p><span class=\"fontstyle3\">(water)(op): </span><span class=\"fontstyle2\">Choose a piece of terrain in the scene (see </span><span class=\"fontstyle3\">Terrain </span><span class=\"fontstyle2\">on page 267). Until the start of your first turn, it counts as having the Obscuring quality for Attack action checks targeting you and your allies.</span></p><p><span class=\"fontstyle3\">(fire)(op): </span><span class=\"fontstyle2\">Choose a character in the conflict and one of their advantages you know. Until the end of their first turn, they apply that advantage to all of their checks.</span></p>"
  },
  {
   "name": "Fortress of Necessity",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>While some generals favor a barren battlefield where steel can face steel, many others look for places where their forces can draw on cover. These locations offer troops a place to regroup, resupply, or take defensive action, but not all battlefields are so accommodating. In such cases, the commander has their army make their own fortifications.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity or a Support action during a mass battle, using adequate supplies and a suitable area, you may make a </span><span class=\"fontstyle2\">TN 3 Command (earth) check </span><span class=\"fontstyle3\">targeting a position you can reach.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you erect a defensive structure of trenches or short barricades in the area. In a mass battle, this structure is treated as a fortification with difficulty value equal to your ranks in Labor plus your bonus successes, which reduces attrition suffered by the cohort occupying it by 2. In a skirmish, this structure is treated as Obscuring terrain by anyone attacking those inside from outside. This structure is temporary, and degrades completely if left to the elements for more than a few days. It can be maintained with a </span><span class=\"fontstyle2\">TN 2 Labor (earth) check </span><span class=\"fontstyle3\">as a downtime activity, which might need to be made more frequently in harsh weather conditions such as rain or snow.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\" style=\"color:rgb(36,32,33);\">(earth)(op): </span><span class=\"fontstyle3\" style=\"color:rgb(36,32,33);\">When you perform the Reinforce action in this fortification during a mass battle, treat the TN as reduced by 1 (to a minimum of 1).</span></p><p><span class=\"fontstyle2\" style=\"color:rgb(36,32,33);\">(earth)(op)(op)+: </span><span class=\"fontstyle3\" style=\"color:rgb(36,32,33);\">Add one of the following terrain qualities per (op)(op) spent this way to the area extending from range 1–3 around the building: Dangerous, Entangling, Obscuring, or Recessed. During a mass battle, enemies attacking a cohort in the fortification are treated as being in terrain with the added qualities.</span></p>"
  },
  {

   "tag": "School Ability",
   "kind": "school_ability",
   "text": "<p><span class=\"fontstyle0\">Once per scene after you perform a Support action, you may choose any number of characters within a number of range bands equal to your ranks in Command. Each chosen character treats their composure as increased by your school rank. This effect persists until the end of the scene.</span></p><p><span class=\"fontstyle0\">During a mass battle, if you are a leader, your army treats its discipline as increased by your school rank.</span></p>"
  },
  {
   "name": "Beseech Hida's Might",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>Contests of strength were a favorite of the Kami Hida, and even today, spiritualists in Rokugan call upon his blessing when sanctifying an area for ritualized battle. Whether the arena is a circle for sumai or a parting of the battle lines for a field duel, it is important that it be properly respected as a place for champions to take up arms.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session as a downtime activity or Support action, you may make a </span><span class=\"fontstyle2\">TN 2 Meditation (Fire) check </span><span class=\"fontstyle3\">targeting an area encompassing 3 range bands around yourself.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, this area becomes an </span><span class=\"fontstyle2\">arena</span><span class=\"fontstyle3\">. When a character makes a Martial Arts check in the arena during the event and does not gain strife from the check, that character reduces the TN of their next check by 1 (to a minimum of 1). This effect persists until the end of the next scene.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If you succeed, the arena gains the Hallowed (fire) terrain quality until the end of the scene.</span></p><p><span class=\"fontstyle2\">(op)+: </span><span class=\"fontstyle3\">If you succeed, increase the Endurance and Composure of each character fighting a duel in the arena by 1 per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Reduce the TN of checks to remove the Bleeding and Dying conditions from characters within the arena by 1 per (op) spent this way (to a minimum of 1).</span></p>"
  },
  {
   "name": "Battle of No Escape",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>There are no conditions of battle simpler or more motivating than “win or die.” A warrior surrounded, with no hope of surrender, is far more likely to be willing to fight to the death, clinging to the feeble chance of survival presented: seize victory or pay the ultimate price. An outnumbered or outmatched commander might intentionally place their troops such that retreat is difficult or impossible, keeping them fighting to the last despite the terrible odds against them.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per scene as a Support action, you may make a </span><span class=\"fontstyle2\">TN 5 Command (void) check </span><span class=\"fontstyle3\">targeting your cohort or a number of characters who can hear you up to your ranks in Meditation. Reduce the TN of this check to 2 if all targets are in Confining or Entangling terrain.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed during a mass battle, your army does not suffer morale collapse if its panic exceeds its discipline, and continues to function normally. This effect persists for one round, plus one round for every three bonus successes. If you succeed during an intrigue, duel, or skirmish, each target ignores the effects of the Compromised condition. This effect persists for one round, plus one round for every two bonus successes.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">+ (Intrigue, Duel, or Skirmish): </span><span class=\"fontstyle3\">Choose one additional target per </span><span class=\"fontstyle5\"> </span><span class=\"fontstyle3\">spent this way.</span></p><p><span class=\"fontstyle5\">(void)(op)(op) </span><span class=\"fontstyle2\">(Intrigue, Duel, or Skirmish): </span><span class=\"fontstyle3\">If you succeed, each target also ignores the effects of the Incapacitated condition for one round, plus one round for every two bonus successes.</span></p>"
  },
  {
   "name": "Soaring Slice",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Jerking their arm in a sudden motion, the bushi hurls their weapon at the enemy, hoping to take the foe off guard or open a gap in their defenses.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack action using one readied weapon in a one-handed grip, you may make a </span><span class=\"fontstyle2\">TN 2 Martial Arts check </span><span class=\"fontstyle3\">with the appropriate skill for the weapon targeting one character at range 2–3.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">You hurl your weapon at the target. If you succeed, you deal physical damage to the target equal to the weapon’s base damage plus your bonus successes. The weapon lands at range in a direction of your choice from the target if they defend against the damage, or embeds in them if they suffer a critical strike. If you fail, the weapon travels a number of range bands equal to the maximum range of the technique in the direction of the target.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Treat the maximum range of this technique as 1 higher per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Reduce the TN of the next Attack action against the target before the end of your next turn by 1.</span></p>"
  },
  {
   "name": "Striking as Fire",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Victory cannot be achieved through defense alone, and it is a poor student of the sword who forgets that their most important goal is simple: cut down their enemy. All else fades to the background as the bushi fiercely presses the attack, trying to force an error or open an opportunity to end their foe.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee, Ranged, or Unarmed] (fire) Attack action check, you may spend</span><span class=\"fontstyle4\"> (op) </span><span class=\"fontstyle3\">in the following way:</span></p><p><span class=\"fontstyle2\">(fire)(op)+: </span><span class=\"fontstyle3\">The next time your target suffers a critical strike, increase its severity by 1 per (op) spent this way. This effect persists until the end of your next turn.</span></p>"
  },
  {
   "name": "Warrior’s Resolve",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>The bushi draws a deep breath, exhaling as they rise to their feet. Pain can be conquered as long as there is a duty to be done. Honor is stronger than steel, it is said, and it falls to the samurai to prove it.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per scene, as a Support action, you may spend 1 Void point to recover.</span></p><p><span class=\"fontstyle2\"><strong>Effects</strong>: </span><span class=\"fontstyle3\">Remove fatigue equal to your honor rank.</span> <br style=\" font-style: normal; font-variant: normal; font-weight: normal; letter-spacing: normal; line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; \"></p>"
  },
  {
   "name": "Striking as Earth",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>After striking, the bushi roots themself to the ground, hunkering down to make sure their armor takes the brunt of a hit or raising a weapon in a warding position where it can deflect harm without being damaged.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee, Ranged, or Unarmed] (earth) check, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(earth)(op)+: </span><span class=\"fontstyle3\">Treat your physical resistance as 1 higher per </span><span class=\"fontstyle4\">(op) </span><span class=\"fontstyle3\">spent this way until the beginning of your next turn.</span></p>"
  },
  {
   "name": "Great Anvil's Measure",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A proud leader often draws attention to themselves in battle, and a leader both proud and skilled does so to draw their enemy into attacking them—especially when the enemy would rather attack elsewhere. When the leader’s troops are properly readied, and especially when they are in a highly defensible location, such an attack against them is doomed to fail.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a check to perform a Guard action in a skirmish (see page 264 of the core rulebook) or a Reinforce action in a mass battle (see page 279 of the core rulebook), you may spend (op) as follows:</span></p><p><span class=\"fontstyle2\">(earth)(op)+ (Guard): </span><span class=\"fontstyle3\">Choose any number of characters in the scene with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. Each chosen character must receive strife equal to your ranks in Performance to perform an Attack or Scheme action targeting any character other than you. This effect persists until the end of your next turn.</span></p><p><span class=\"fontstyle2\">(earth)(op)+ (Reinforce): </span><span class=\"fontstyle3\">Choose any number of leaders in the enemy army with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. The enemy army receives panic equal to your ranks in Performance each time any of those leaders performs an Attack or Scheme action targeting any cohort other than yours. This effect persists until the end of your next turn.</span></p>"
  },
  {
   "name": "Beseech Shiba's Calm",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>Shiba was a warrior, but he did not love war—despite his vast might, he sought peace over conflict and compromise over bloodshed. Yet war was inescapable in his lifetime, and so he sought Isawa’s spiritual expertise to learn methods for purifying battlefields after times of bloodshed profaned the land. As the War with Fu Leng dragged on, Isawa saw the wisdom in sharing this knowledge, and the rites he taught Shiba for stilling the unsettled spirits of the land after the shedding of blood are used in Rokugan even centuries later.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session after participating in a Mass Battle or as a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 3 Theology (void) check </span><span class=\"fontstyle3\">targeting an area upon which a mass battle was fought earlier that day.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, remove the Defiled terrain quality from the area.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If the area gained the Dangerous, Entangling, or Obscuring terrain quality during the battle through supernatural means, remove one or more of those terrain qualities of your choice.</span></p><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Remove the Imbalanced terrain quality from the area.</span></p><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Until the end of the game session, non-Tainted beings reduce the TN of Theology checks they make in this area by 1 (to a minimum of 1), and Tainted beings increase the TN of all checks they make in this area by 1.</span></p><p><span class=\"fontstyle2\" style=\"color:rgb(36,32,33);\">(op)+: </span><span class=\"fontstyle3\" style=\"color:rgb(36,32,33);\">Reduce the TN of any Fitness or Meditation checks that characters in your army need to make at the end of a scene by 1 per (op) spent this way, to a minimum of 1.</span></p>"
  },
  {
   "name": "Righteous Example",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A leader’s power exists only in the minds of their followers, yet none can deny the power of an army. In Rokugani warfare, leaders and even commanders often take the field themselves at the start of battle, showing that they shoulder a portion of the risk alongside their warriors. This helps spur their forces on to great victories no warrior alone could achieve.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack and Support action during a mass battle, you may make a </span><span class=\"fontstyle2\">TN 3 Martial Arts (fire) check </span><span class=\"fontstyle3\">targeting an enemy leader’s cohort.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, the enemy army suffers attrition and panic equal to 1 plus your bonus successes. If you succeed, other leaders in your army reduce the TN of their Attack action checks by 1. This effect persists until the end of your next turn. If you fail, reduce the TN of Attack and Scheme action checks targeting your cohort by 1. This effect persists until the end of your next turn.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(fire)(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If you are both the commander and a leader, your army gains 1 momentum point toward its current strategic objective.</span></p>"
  },
  {
   "name": "Heartpiercing Strike",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Battle is the art of killing, and woe betide any warrior who forgets it. With a roar, the bushi launches forward, stabbing out with their weapon to fatally impale their enemy. Even if the strike does not slay the foe, it is likely to weaken them significantly.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack and Movement action using a readied weapon, you may make a </span><span class=\"fontstyle2\">TN 4 Martial Arts (fire) check </span><span class=\"fontstyle3\">using the appropriate skill for that weapon, targeting one character within the weapon’s range.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your target suffers a critical strike with severity equal to your weapon’s deadliness plus your bonus successes. The TN of the Fitness check to resist this critical strike is 3 ((air) 4, (water) 1) instead of the normal TN. If you fail, you suffer the Disoriented condition.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p>(fire)(op)<span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Before resolving the effect, move up to 1 range band toward your target.</span></p>"
  },

   "tag": "Title Ability",
   "kind": "title_ability",
   "text": "<p><span class=\"fontstyle0\">Once per scene, after you make a successful Martial Arts check that inflicts fatigue or a critical strike on the target, you may have each friendly character at range 0–3 of you or the target remove an amount of strife equal to the TN of the check.</span></p>"

   "name": "The Patient Viper",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>Sometimes, the best way to approach a target is to stand still. Shinobi often lie in wait for hours or even days, patiently maintaining their position to ensure that they strike well when their foe arrives.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 4 Fitness (earth) check </span><span class=\"fontstyle3\">targeting your cohort </span><span class=\"fontstyle3\" style=\"color:rgb(0,0,0);\">(if you are currently the leader of a cohort) </span><span class=\"fontstyle3\">or yourself and a number of other characters up to your ranks in Command (in any other scene) who are within Dangerous, Entangling, or Obscuring terrain.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, all targets become hidden and are not noticed by characters with vigilance lower than or equal to your Earth Ring plus your bonus successes. These hidden characters cannot be the target of Attack actions. This effect persists until the end of your next turn, or until any target you have hidden performs an Attack or Movement action.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(earth)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">This effect persists for one additional round per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(earth)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Reduce the TN of the first Attack action check one of your targets makes against another character in the terrain in which your forces are hidden by 1 per (op) spent this way.</span></p>"
  },
  {
   "name": "Beseech Akodo's Judgment",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>In Leadership, Akodo wrote of the importance of terrain in battle, and of knowing how best to use terrain not only to one’s advantage, but to motivate one’s troops. The terrain will guide the actions of the troops as much as the words of the commander, or so Akodo holds, and so a prudent general seeks the terrain that will maintain order in their own soldiers while disrupting that of their enemies.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session as a Support action, you may make a </span><span class=\"fontstyle2\">TN 3 Tactics (void) check </span><span class=\"fontstyle3\">targeting one terrain feature on the battlefield (or one battle zone, if using the rules for battle zones).</span></p><p><span class=\"fontstyle2\"><strong>Effect:</strong> </span><span class=\"fontstyle3\">If you succeed, increase your army’s discipline by your glory rank plus your ranks in Command as long as your army has at least one cohort occupying the chosen terrain feature (or in that battle zone, if using the rules for battle zones). This effect persists until your army has no cohort occupying that feature (or zone), or until the end of the scene.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed and designate a fortification (or a battle zone with a fortification in it), while your army occupies that fortification, increase that fortification’s difficulty level by 1 per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Each time your army suffers panic from battle fatigue during this scene, it suffers 1 less per (op) spent this way (to a minimum of 1).</span></p>"
  }
 ],
 "peculiarities": [
  {
   "name": "Bishamon’s Blessing",
   "tag": "Distinction",
   "ring": "water",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>The walls of many an inn in Rokugan ring with a wellknown song, “The Badger and the Stone,” a ballad that tells the tale of an ancient battle far in the Great Wall of the North Mountains.</em></span></p><p><span class=\"fontstyle0\"><em>The story goes that a vicious tribe of Yobanjin were surging through a mountain pass, only to be stopped by a single nameless samurai of the Badger Clan, who called upon the Fortune Bishamon for aid and lifted an immense stone, hurling it down the walls of the pass. The mighty stone triggered an avalanche, which crushed the foreign invaders and sealed the pass forever.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Bishamon’s Blessing distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You recover from physical exhaustion twice as quickly as others.</span></p></li><li><p><span class=\"fontstyle3\">When performing a check for which the favor of this Fortune is a benefit (such as a Fitness (water) check to recover from exhaustion or a Martial Arts [Unarmed] (water) check to subdue a foe), you may reroll up to two dice.</span></p></li></ul>"
  },
  {
   "name": "Fukurokujin’s Curse",
   "tag": "Adversity",
   "ring": "fire",
   "kind": "adversity",
   "text": "<p><em>“Study is like sailing against a current; a boat must forge ahead, lest it be swept downstream. But those without a boat must go where the current takes them; not all people are made to be sailors.”</em></p><p><em>– Analects of Nabeshima</em></p><p></p><p>The following apply to a character with the Fukurokujin’s Curse adversity:</p><ul><li><p>- It takes you twice as long to gain a grasp of an academic field of study as it does another character.</p></li><li><p>- When you make a check to extrapolate how to do something in a field of study (such as a Medicine (fire) check to guess how to treat an unfamiliar aliment based on its symptoms or a Survival (fire) check to guess an unknown creature’s qualities based on its physiology), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Glorious Deeds",
   "tag": "Passion",
   "ring": "fire",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>“Even should a samurai evade death on the battlefield and survive to see their great-grandchildren come of age, one day they will pass. Such is the way of mortals. But the stories that people tell of that samurai—those may live forever.” The Ikoma historian gave his sibling a shrewd look.</em></span></p><p><span class=\"fontstyle0\"><em>“But you did not come to listen to the lectures I have for students, I suspect. You want to be the subject of my next lecture. Tell me of your accomplishments, and I will make sure they are recorded in the family histories.”</em></span></p><p><span class=\"fontstyle0\"><em>With that prompting, the eager bushi launched into a story about their efforts in the recent conflict, and they were not silent until late into the night.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Glorious Deeds passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You find risking your life to be a simple matter, as long as there is a witness to remember your bravery. No threat or challenge deters you if you might be remembered for it, making even the most daunting tasks easy ones for which to prepare.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to improve your reputation or gain fame as a great samurai (such as a Performance (fire) check to impress a court with your new melody, or a Tactics (fire) check to execute a daring raid on the enemy), you remove 3 strife.</span></p></li></ul>"
  },
  {
   "name": "Belligerent",
   "tag": "Anxiety",
   "ring": "earth",
   "kind": "anxiety",
   "text": "<p><em>“Matsu-san, no! We are guests here.” The courtier looked on in horror as Matsu Chiyoko gripped her blade as if to draw it.</em></p><p><em>“They should have remembered their duties as hosts, then, instead of insulting me,” Chiyoko retorted, before returning her attention to the Crane samurai in front of her. “I challenge you, for your insult! If you would belittle my courage, I dare you to prove your own.”</em></p><p><strong>Effects:</strong> The following apply to a character with the Belligerent anxiety:</p><ul><li><p>-  You find it nearly impossible to keep your cool when provoked, and may even look for an excuse to fight with people you consider deserving of a good thrashing. Delicate social situations can easily spiral out of control when you suspect the other party of giving offense.</p></li><li><p>-  After performing a check to respond to provocation without resorting to violence or threats (such as a Performance (earth) check to calmly sing a song that was originally composed to paint your lineage in an unflattering light or a Meditation (earth) check to stay in formation when you spot a rival across the battlefield), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Superstition",
   "tag": "Anxiety",
   "ring": "void",
   "kind": "anxiety",
   "text": "<p><em>“A great deal of folk wisdom revolves around death. Peasants will avoid the number four because the pronunciation is close to one of the words that means ‘death.’  Chopsticks should never be stuck upright in rice, as this mimics the placement of a ceremonial bowl upon the altar at a funeral. And one should never, ever write a person’s name in red ink, as the names on grave markers always are painted in red.”</em></p><p><em>–Observances of Empire, by Moto Kojiro</em></p><p><strong>Effects:</strong> The following apply to a character with the Superstition anxiety:</p><ul><li><p>-  When faced with signs of the supernatural, you become visibly agitated, and you attempt to leave the scene, appease the being or phenomenon in question, or acquire supernatural protection of some kind.</p></li><li><p>-  After performing a check to interact with or learn about a supernatural being or phenomenon (such as a Meditation (void) check to perceive the presence of a supernatural being or a Theology (void) check to know a supernatural being’s designs or desires), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Indomitable Will",
   "tag": "Distinction",
   "ring": "earth",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>The travelers cowered as the ghost, shrieking hideously, drifted toward them from the ruins of the ancient temple where they’d chosen to make camp for the night. The moonlight lent the spirit an unearthly glow, and its howls echoed in their ears as it grew ever closer.</em></span></p><p><span class=\"fontstyle0\"><em>“It is a gaki—a hungry ghost!” shouted Yogo Kikuyo, stepping between the travelers and the spirit as she rummaged through her bag.</em></span></p><p><span class=\"fontstyle0\"><em>“Are you not afraid?” shouted one of her companions, as he clutched at her waist, trying to draw her back from the wailing apparition.</em></span></p><p><span class=\"fontstyle0\"><em>“I am not,” Kikuyo said, as she drew a paper ofuda talisman, inscribed with blessings, from her satchel. “I am familiar with its sort.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Indomitable Will distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You can always choose to stand your ground, even when faced with untenable odds, supernatural terrors, or sorcerous powers that bend the minds of lesser souls.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which you need to keep your cool when dealing with danger (such as a Command (earth) check to give orders under pressure or a Meditation (earth) check to resist the effects of fear), you may reroll up to two dice.</span></p></li></ul>"
  }
 ],
 "titles": [
  {
   "name": "Renowned Warrior",
   "text": "<p><span class=\"fontstyle0\">Most samurai who serve on the battlefield are not driven by a desire for monetary recompense, but this does not mean that they are not motivated by rewards. Recognition by one’s daimyō or commander is highly sought-after, and a choice word of praise from an individual of sufficient influence can spread quickly through a province or even across the entire Empire.</span></p><p><span class=\"fontstyle2\"><strong>Assigned by:</strong> </span><span class=\"fontstyle0\">A daimyō or army commander with status 60 or higher after you have been part of a mass battle in which your cohort was the one to complete at least one strategic objective.</span></p><p><span class=\"fontstyle2\"><strong>Glory Award:</strong> </span><span class=\"fontstyle0\">+5</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+5 (to a maximum of 40)</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Behold the Legend</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Martial Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Command</p></td><td><p>Skill</p></td></tr><tr><td><p>Culture</p></td><td><p>Skill</p></td></tr><tr><td><p>Performance</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-kata\">(kata) Rank 1-2 Kata</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-kata.Item.L5RCoreKat000003\" data-pack=\"l5r5e.core-techniques-kata\" data-type=\"Item\" data-id=\"L5RCoreKat000003\">(kata) Heartpiercing Strike</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000079\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000079\">(shuji) Righteous Example</a> (prereq)</p></td><td><p>Technique</p></td></tr></tbody></table>",
   "ability": null,

  }

 "bonds": [
  {
   "name": "Doji Setsuna",
   "text": "<p><span class=\"fontstyle0\">Samurai are expected to place romantic love below their obligations to family and clan—but the human heart is not so easily confined. Many samurai who fall in love keep their relationship secret, while others are more overt. The following are suggested narrative effects for a character with a Lover bond:</span></p><ul><li><p><span class=\"fontstyle0\">- A lover seeks to spend time with you, writes letters to you, and is willing to assist you in ways that do not require publicly acknowledging your bond (giving you information key to pursuing a desired goal, encouraging you to pursue your personal interests, helping you to deal with emotions you usually must keep to yourself), and they expect you to do the same.</span></p></li><li><p><span class=\"fontstyle0\">Generally, your lover’s allies do not acknowledge your relationship. Some might be favorably disposed to you covertly if you make their ally happy (and unfavorably disposed if you make them unhappy), while others might be jealous of the attention you receive. Your lover’s enemies might target you to attempt to gain leverage over your lover.</span></p></li><li><p><span class=\"fontstyle0\">If your bond rank is 3 or higher, a lover is more overt about your relationship, allowing them to assist you more publicly (such as giving you letters of introduction to officials above your status, allowing you to use their name to pursue your goals, and even helping you directly), and they expect the same from you.</span></p></li></ul><p></p><p><span class=\"fontstyle3\"><strong>Bond Ability:</strong> With You, the Storm Subsides</span></p>"
  }
 ],
 "gear": [
  {
   "name": "Katana",
   "kind": "Weapon",

   ],
   "rarity": "7",
   "text": "<p><span class=\"fontstyle0\">As much a work of art as it is a weapon, the katana is perhaps the most revered weapon in Rokugan. It has an elegant, slightly curved blade between three and four feet long, made of steel that is specially folded during its creation. This unique forging style ensures that the inner part of the blade remains springy and soft while the outside is as hard as tempered steel. Each sword likely has a history and legacy, and it is a constant reminder of the weight that destiny has placed upon its bearer’s shoulders as a samurai of Rokugan</span>.</p>"

  {
   "name": "Wakizashi",
   "kind": "Weapon",
   "category": "Swords",
   "skill": "melee",

   "damage": 3,
   "deadliness": 5,
   "grips": "Deadliness +2",
   "qualities": [
    "Ceremonial",
    "Razor-Edged"
   ],
   "rarity": "7",
   "text": "<p><span class=\"fontstyle0\">Whereas the katana represents a samurai’s status as a warrior, the wakizashi represents their place in Rokugan’s social order and strict caste system. The wakizashi is a small, katana-like sword usually two to three feet in length, with the same flexible blade and lethal edge. It is often made as part of a pair, with the same decorations as its matched katana. The wakizashi also fills another role: it clearly signals that its wearer is a samurai, and a person of honor who will make the ultimate sacrifice for their ideals and their master. It is the tool with which a samurai commits seppuku: ritual suicide, the last protest of an aggrieved and honorable samurai.</span></p>"

   "rarity": "5",
   "text": "<p><span class=\"fontstyle0\">Long and narrow, a tetsubō can be as tall as a human and normally is constructed of iron or hardwood. Above its grip, a tetsubō is covered in steel, iron, or even jade spikes or studs that add to the weapon’s lethality and crush armor or plated carapace with ease.</span></p>"

   "skill": "ranged",

   "damage": 4,
   "deadliness": 5,

    "Wargear"
   ],
   "rarity": "4",
   "text": "<p><span class=\"fontstyle0\">Among the Unicorn Clan’s many adopted weapons is a small, sturdy bow used by the nomadic peoples of the steppes far to the west. Called the Shinjo horsebow in Rokugan, this weapon is a compact bow designed to be fired from the back of a moving horse. It is a shortrange weapon intended for raiding and cavalry attacks</span>.</p>"

   "range": "1",
   "damage": 2,
   "deadliness": 2,
   "grips": "N/A",
   "qualities": [
    "Ceremonial",
    "Wargear"
   ],
   "rarity": "4",
   "text": "<p><span class=\"fontstyle0\">The gunbai, a leader or commander’s war fan, is a staple of samurai officers for communicating orders to their troops at a distance. Each gunbai is unique, as are the gestures the officers use to communicate orders to their troops. With a flick of the wrist, an officer may order their troops to fall back or to charge into the fray. Often gilded with metal, a gunbai is used to convey urgent tactical shifts and defensive moves.</span></p><p><span class=\"fontstyle0\">A gunbai can be wielded as a one-handed Martial Arts [Melee] weapon with the following profile: Range 1, Damage 2, Deadliness 2.</span></p><p><span class=\"fontstyle0\">During a skirmish, a character with a gunbai readied can perform shūji targeting characters who can see them at range 0–6 (as opposed to the usual auditory range restriction of range 0–4).</span></p><p><span class=\"fontstyle0\">During a mass battle, for each of an army’s leaders equipped with a gunbai, the army increases its discipline by 2.</span></p>"
