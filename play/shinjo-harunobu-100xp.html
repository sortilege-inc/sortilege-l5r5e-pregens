 "ninjo": "He feels constrained by courts and by command. He wants men under his own command, particularly after the debacle with the Lion.\n\n1. **He Disagrees with Kamoko but Must Obey**\n    - He believes **his strategies are often more sound**, but as long as **Kamoko holds authority**, he **must defer to her final decision**—even when he sees a mistake coming.\n    - He might **occasionally challenge her, but always within respectful bounds**—never outright defying her, though the temptation is there.\n2. **He Watches Kamoko Command and Thinks, ‘That Should Be Me.’**\n    - He respects Kamoko but **knows he is just as capable**—perhaps even more so, because he understands **both Unicorn and Crab military doctrines**.\n    - The **frustration of seeing an opportunity and being unable to seize it** gnaws at him.\n3. **He Feels Trapped by Loyalty**\n    - If Kamoko **relies on him so much**, why isn’t he **the one leading the armies**?\n    - He cannot **betray her or act dishonorably**, but his **own ambition remains unfulfilled**.\n4. **He Sees Court Politics as a Route to Power, But Refuses to Engage**\n    - The irony is that **a politically savvy samurai could maneuver themselves into a greater command**, but Harunobu **disdains courtly maneuvering**—which **keeps him locked in Kamoko’s shadow**.\n    - His **refusal to play the political game could be what’s preventing his rise**, but he still **sees politics as beneath him**.",
 "giri": "Utaku Kamoko\n\n1. **Strategic Commander in Utaku Kamoko’s Forces**\n    - Commands **a specialized force within the Unicorn army**, focusing on **long-term campaign planning and battlefield logistics**.\n    - **Directs defensive operations** when Kamoko’s usual fast-strike tactics need reinforcement.\n    - Trusted to **lead forces independently** when Kamoko must focus elsewhere.\n2. **Kamoko’s Personal Advisor**\n    - One of **the few people Kamoko trusts to challenge her ideas** without undermining her authority.\n    - Offers **alternative strategies** when pure cavalry charges won’t work.\n    - Helps Kamoko **anticipate enemy movements**, particularly against foes like the **Lion and Scorpion**, who rely on deception and layered tactics.\n3. **Crab Clan Liaison**\n    - Handles **military negotiations between the Unicorn and Crab**, ensuring both sides **coordinate effectively** in shared operations.\n    - Respected by **Crab commanders**, even if they see him as **too soft for having returned to the Unicorn**.\n    - Acts as a **buffer** when Unicorn cavalry tactics clash with the Crab’s **fortification and attrition warfare strategies**.\n    - Ensures that **Unicorn supply lines remain open** when dealing with the often blunt and inflexible Hida.",
