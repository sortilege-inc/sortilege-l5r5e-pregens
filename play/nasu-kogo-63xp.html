   "name": "Interpreter (Ivory Kingdoms)",
   "text": "<p><span class=\"fontstyle0\">Although many within Rokugan live their entire lives without thinking of the Empire’s neighbors, the truth is that many other civilizations touch upon the Emerald Empire in one way or another. Some, such as the Ivory Kingdoms, have contact by way of the shared danger that is the Shadowlands. Others, such as the Seikitsu of the northern mountains, exist much nearer geographically to Rokugan but are deeply distinct in culture and way of life. And as human cultures have different languages and customs, interpreters are often required to assist in situations where these groups interact.</span></p><p><span class=\"fontstyle0\">Interpreters are expected to become fluent not only in the languages of the people they study but also in the practices and cultural touchstones of those groups. They must be able not only to translate but also to transliterate, understanding and conveying intent beyond the literal meaning of the words. This makes becoming an excellent interpreter a challenging process, requiring not only language skills but also keen insight into human nature.</span></p><p><span class=\"fontstyle2\"><strong>Assigned By:</strong> </span><span class=\"fontstyle0\">The GM, after a character has gained an initial familiarity with another culture and desires to learn more.</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+5</span></p><p><span class=\"fontstyle2\"><strong>Glory Award:</strong> </span><span class=\"fontstyle0\">+5</span></p><p><span class=\"fontstyle2\"><strong>Special:</strong> </span><span class=\"fontstyle0\">A character who has completed this title can be assigned it again for a new group. The new instance of the title counts as a different title, which can be completed again, conferring benefits for the new group selected.</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Linguistic Liaison</span></p><h2>Curriculum</h2><table><tbod
