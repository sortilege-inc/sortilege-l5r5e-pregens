 "ninjo": "Strictures too often interfere with a beautiful tale.\n\nShe escapes into literature, particularly pillow-books, and riding her horse, Kogorashi, a Utaku steed and wedding gift from her husband's family.",
 "giri": "Currently, Kitsuki Kāgi, in service as an Emerald Magistrate under the Emperor.\n\nPreviously, she served Asahina Shigehiro, lord of the city of Shirogome, on issues of imperial law and legal arbitration.\n\nHer giri: Rule must bind, and if needed, contort.",

 "techniques": [
  {
   "name": "Courtier’s Resolve",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Warriors do battle with their bodies, and courtiers do battle with their minds. To maintain one’s composure while surrounded by the challenges of court, one must be able to clear and organize one’s mind, returning focus to the most vital tasks.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per scene as a Support action, you may spend 1 Void point to recover from strife.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">Remove strife equal to your glory rank.</span> <br style=\" font-style: normal; font-variant: normal; font-weight: normal; letter-spacing: normal; line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; \"></p>"

  {
   "name": "Stonewall Tactics",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>The courtier makes themself impossible for the target to ignore, raising a pressing concern that must be addressed first or even physically planting themself between a rival and their allies.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When making a Social skill (earth) or Martial skill (earth) check targeting a character, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(earth)(op)+: </span><span class=\"fontstyle3\">Increase the TN of any check the target makes that does not target you by 1 per (op) spent this way. This effect persists until the beginning of your next turn.</span></p>"
  },
  {
   "name": "Procedure and Protocol",
   "tag": "School Ability",
   "kind": "school_ability",
   "text": "<p><span class=\"fontstyle0\">When you cause a character to receive strife as a result of a check using a social approach, that character suffers additional strife equal to your school rank.</span></p>"
  },
  {
   "name": "Beware The Smallest Mouse",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Often, minor functionaries at court find themselves able to successfully complete their tasks because they are so unimportant that nobody bothers to impede them (or even notices their existence). Some courtiers quickly learn to play up this appearance when need be.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Social skill (water) check targeting one or more characters, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(water)(op)(op)+: </span><span class=\"fontstyle3\">While interacting with you, the target treats their vigilance as 1 lower per (op)(op) spent this way and decreases the TN of their social checks targeting you by 1. This effect persists until the end of the scene</span>.</p>"
  },
  {
   "name": "Treaty Signing",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>Entering into treaties and other formal agreements between clans and families has become something of a ritual over the centuries. The particulars vary from clan to clan (Unicorn treaties are often accompanied by the exchange of horses, while the Dragon generally ask for an hour of meditative contemplation beforehand), but generally such agreements involve both parties signing a document that contains the terms of the agreement and making pledges to uphold the agreement in front of an audience. The audience ensures the agreement is widely publicized, making it that much harder for either side to back down without losing face. However, inventing a document that both sides are willing to agree to is a true creative challenge. Such treaties become legendary amongst Rokugani diplomats.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session as a downtime activity (see page 248 of the core rulebook), you may make a </span><span class=\"fontstyle2\">TN 2 Composition (fire) check </span><span class=\"fontstyle3\">to write an agreement. If you succeed, you may make a </span><span class=\"fontstyle2\">TN 3 Government (air) check </span><span class=\"fontstyle3\">targeting yourself and a number of other characters, who are also participants. Up to three other participants may assist, providing the usual benefits (see </span><span class=\"fontstyle2\">Assistance </span><span class=\"fontstyle3\">on page 26 of the core rulebook).</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, each participant is assured that there are no mistakes or objectionable loopholes to the agreement, and that the agreement is acceptable to all parties involved. Each participant stakes 10 honor on upholding the agreement. Anyone who later breaks the agreement loses the honor they staked, unless another participant broke the agreement first.</span></p><h4><span class=\"fontstyle4\">New Opportunities (Both Checks)</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed, all participates stake 1 additional honor, plus 1 additional honor per (op) spent this way.</span></p><p><span class=\"fontstyle2\">(op)(op)(op): </span><span class=\"fontstyle3\">If you succeed, you need only stake half the honor that the other participants stake.</span></p>"
  },
  {
   "name": "Civility Foremost",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Samurai are warriors, but there are many contexts in which violence is inappropriate. Many strictures exist around the times weapons can and cannot be drawn. A courtier who has memorized the rules of such engagements can articulate why fighting would be improper or profane in nearly any situation.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Scheme action, you may make a </span><span class=\"fontstyle2\">Command </span><span class=\"fontstyle3\">or </span><span class=\"fontstyle2\">Courtesy (earth) check </span><span class=\"fontstyle3\">targeting one character to claim protection for an individual of your choice by rights of honor. The TN of the check is equal to the target’s vigilance.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, the target must forfeit honor equal to your Earth Ring plus your bonus successes and suffer that much strife to perform an Attack or Scheme action targeting the chosen individual. This effect persists until the end of the scene, or until the target performs an Attack or Scheme action.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(earth)</span><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Choose one additional target with vigilance lower than or equal to your first target’s vigilance per (op) spent this way.</span></p>"
  },
  {
   "name": "Well of Desire",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Bribery is considered to be corruption in Rokugan, yet gift exchanges and gift giving is a time-honored tradition. The shrewdest courtiers can engineer scenarios in which their targets cannot refuse their gifts without tarnishing their reputations. Thus, the recipient of such a poisoned gift might find it preferable to owe the courtier a favor than to be shamed in public.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Courtesy (water) check to present a gift to a target, you may spend </span><span class=\"fontstyle4\">(op) </span><span class=\"fontstyle3\">as follows:</span></p><p><span class=\"fontstyle2\">(water)(op): </span><span class=\"fontstyle3\">To refuse your gift, your target must forfeit glory equal to your Water Ring. Additionally, if the gift is something that the target desires, the target also must suffer strife equal to its rarity to refuse it. If your target accepts the gift, reduce the TN of your next Social skill check targeting them by the rarity of the item (to a minimum of 1).</span></p>"
  },
  {
   "name": "The Wind Blows Both Ways",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A word in the right ear at the right time can enhance the accomplishment of another, or a cutting slight can diminish their success in the eyes of those who matter.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Courtesy or Performance (air) check targeting another character, you may spend (op) in the following ways:</span></p><p><span class=\"fontstyle4\">(air)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">The next time the target receives a glory award, increase the glory they gain by 1 per (op) spent this way. This effect persists until the end of the scene.</span></p><p><span class=\"fontstyle2\">(air)(op)+: </span><span class=\"fontstyle3\">The next time the target forfeits or stakes glory, increase the glory they must forfeit or stake by 1 per (op) spent this way. This effect persists until the end of the scene.</span></p>"
  },
  {
   "name": "Call to Ride",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A skilled rider can train their loyal steed to come to them on command. When the rider takes a long journey through perilous lands, this technique can be especially vital for escaping the chaos of battle or pursuing marauders who have struck at their caravan.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Support action, you can make a </span><span class=\"fontstyle2\">TN 1 Survival (water) check </span><span class=\"fontstyle3\">targeting your mount or animal companion, provided it is within range 5 of you.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your mount or animal companion immediately moves up to 2 range bands toward you, plus 1 additional range band for every two bonus successes. If it is a mount and ends at range 0 of you, you can immediately mount it.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Increase the TN of Attack action checks targeting you and your mount or animal companion by 1. This effect persists until the end of your next turn.</span></p><p><span class=\"fontstyle2\">(op)(op): </span><span class=\"fontstyle3\">If you perform a Maneuver action after mounting, you may move up to 2 range bands instead of 1.</span></p>"
  },
  {
   "name": "Crescent Moon Style",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Striking first is valuable, but so is surviving. To defend without sacrificing offense, a bushi must be ready to retaliate swiftly after blocking or evading. With a quick shift, the bushi switches from defense to bring down their full force upon their enemy.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you perform Guard action (see page 264), you may spend </span><span class=\"fontstyle4\">(op) </span><span class=\"fontstyle3\">in the following way:</span></p><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">After a character at range 1–2 performs an Attack action targeting you or another character you are guarding, you may perform a Strike action with one readied Martial Arts [Melee or Unarmed] weapon targeting that character (if they are within your weapon’s range). This effect persists until the start of your next turn, or until you perform a Strike action this way.</span></p>"

  {

   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Entrapping techniques can be performed with many different weapons, from the </em></span><span class=\"fontstyle2\"><em>kusari-gama </em></span><span class=\"fontstyle0\"><em>wielded by brigands to the ornate, hook-headed polearms used by the Phoenix Clan’s greatest masters of the spear.</em></span></p><p><span class=\"fontstyle3\"><strong>Activation:</strong> </span><span class=\"fontstyle2\">When you make a Martial Arts [Melee] or Martial Arts [Unarmed] check using a Snaring weapon, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle3\">+: </span><span class=\"fontstyle2\">Choose one weapon a target has readied; that weapon cannot be used for Attack actions. This effect persists until the end of your next turn.</span></p><p><span class=\"fontstyle3\">(op)(op)+: </span><span class=\"fontstyle2\">One target of your action per (op)(op) spent this way becomes Immobilized.</span></p>"
  },
  {
   "name": "Open-Hand Style",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Power does not come from speed alone. A master martial artist can apply force for maximum effect, making even gentle movements devastatingly effective blocks and strikes. With enough experience, a martial artist can even control their opponent’s stance.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Unarmed] check using a weapon with the Snaring quality, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(op)(op)+: </span><span class=\"fontstyle3\">One target of your action per (op)(op) spent this way must switch to a different stance of your choice. Targets of silhouette 3 or greater may resist with a </span><span class=\"fontstyle2\">TN 3 Fitness check </span><span class=\"fontstyle3\">and ignore this effect if they succeed.</span></p>"

  {

   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A good courtier learns how to read the desires of those around them from the subtle cues of their responses in conversation, as well as how to probe for details without revealing their intentions.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Social skill (water) check targeting a character, you may spend (op) as follows:</span></p><p><span class=\"fontstyle2\">(water)(op): </span><span class=\"fontstyle3\">Learn of one material item or worldly experience the target desires.</span></p><p><span class=\"fontstyle2\">(water)(op)(op): </span><span class=\"fontstyle3\">Learn the target’s ninjō (see page 38).</span></p>"

 ],
 "peculiarities": [
  {
   "name": "Scorn of [One Group]",
   "tag": "Adversity",
   "ring": "water",
   "kind": "adversity",
   "text": "<p><em>“Hatsumon cannot assume the command,” Utaku Kamoko growled. No “-sama,” not even a “-san,” and certainly not “Utaku Hatsumon,” not after his crime of riding one of the sacred Utaku steeds.“With Shinjo Reki’s death, Hatsumon Noyan is thehighest ranked officer present,” soothed Ide Ujiyasu. “The command is his.” </em></p><p><em>“So be it,”Kamoko snarled, and stalked from the tent. The entire Shiotome contingent left the encampment the next day.</em></p><p></p><p>The following apply to a character with the Scorn of [One Group] adversity:</p><ul><li><p>-  You have earned the ire of a particular group, which has seriously damaged your ability to work with its members or enlist their help. You have been barred from entering their facilities, and they refuse to meet or communicate with you directly. Confer with the GM to select a campaign-appropriate group when choosing this disadvantage.</p></li><li><p>-  When performing a check to interact with the chosen group that relies on your rapport with its members (such as a Courtesy (water) check to persuade them to do something or a Performance (water) check to impress a group of them), you must choose and reroll two dice containing (su) or (ex) . After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Wordplay",
   "tag": "Passion",
   "ring": "air",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>The language of Rokugan is particularly suited for wordplay. Words that sound alike can have different meanings depending on the character used to write them, and they can sound close to other words altogether, allowing for puns of intricately layered complexity. On top of that, Rokugani poets play with symbolism, metaphor, and simile, adding another layer of meaning. Crafting a clever construction of verbal legerdemain is a prized skill, and one that can ensure one’s favor in the right circles.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Wordplay passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You can always identify rhetorical and literary patterns in the works of others when reading or listening to them.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to interpret or create a play on words (such as a Composition (air) check to write a poem with a perfectly executed poetic pun or a Performance (air) check to subtly imply something to your audience via a double meaning), you remove 3 strife.</span></p></li></ul>"
  },
  {
   "name": "Fear of Death",
   "tag": "Anxiety",
   "ring": "earth",
   "kind": "anxiety",
   "text": "<p><em>There are few crimes worse in the mind of the Rokugani than cowardice, which is seen as a violation of no fewer than three tenets of the Code of Bushidō: Yū, Meiyo, and Chūgi. To help them teach the lessons of cowardice, Rokugan’s storytellers have many fables at their disposal: tales of courageous heroes brought low by cowardly allies, histories in which the fall of an entire noble house hinges upon a failure of courage, and more.</em></p><p><strong>Effects:</strong> The following apply to a character with the Fear of Death anxiety:</p><ul><li><p>-  You cannot voluntarily choose to die or sacrifice your life (including committing seppuku when honor demands it), and if there is a chance you could live, you must always pursue it.</p></li><li><p>-  After performing a check to risk your life or accept your mortality (such as a Meditation (earth) check to find inner tranquility before battle or a Tactics (earth) check to hold a position against long odds), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Haunting",
   "tag": "Adversity",
   "ring": "void",
   "kind": "adversity",
   "text": "<p><em>The tale is told of Toritaka Kanoshi, a young samurai of the Falcon Clan, whose father was betrayed and murdered by a family friend. The ghost of the father appeared to the young man and bade him to avenge his murder, but Kanoshi refused to believe that the spirit was truly that of the elder Toritaka. The father’s ghost followed Kanoshi around for years, creating a great commotion that only his son could hear. In the end, nearly driven mad by the torment, Kanoshi finally obeyed the ghost’s wishes and brought the murderer to justice. Satisfied, his father was finally at rest, and he haunted Kanoshi no more.</em></p><p></p><p>The following apply to a character with the Haunted adversity:</p><ul><li><p>- The spirit has their own agenda (determined by the GM), which interferes with yours at inopportune times.</p></li><li><p>- When you make a check to defy the will of the spirit haunting you (such as a Meditation (void) check to find solace in meditation or a Skulduggery (void) check to perform disreputable acts to survive), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Blessed Lineage",
   "tag": "Distinction",
   "ring": "void",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“Perhaps you’d like to match your words with your steel,” the woman growled, her hands resting upon the hilts of her swords. “You will learn a hard lesson: nobody insults Mirumoto Ohatsu with impunity.”</em></span></p><p><span class=\"fontstyle0\"><em>The man she faced smiled in return.</em></span></p><p><span class=\"fontstyle0\"><em>“I certainly did not intend to offend you in any way, Ohatsu-san. Please allow me to introduce myself. I am Miya Matsuo. Perhaps you have heard of my cousin, the Imperial Herald?”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Blessed Lineage distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- Characters with status of 50 or higher understand that they might suffer a loss of prestige if they harm you, and thus do not choose to kill you as their first option, even if you are a political obstacle they would otherwise eliminate without hesitation.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which your esteemed lineage is a benefit (such as a Command (void) check to challenge someone’s perception of a situation or a Government (void) check to know the likelihood of a political eventuality), you may reroll up to two dice.</span></p></li></ul>"
  },
  {
   "name": "Paragon of Courtesy",
   "tag": "Distinction",
   "ring": "air",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“The heroes of myth—even the ones who were not of divine blood—did not live as humans do. It is impossible to embody an ideal without surpassing some part of your own humanity.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Paragon of Courtesy distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You believe utterly in Courtesy, and others instinctively discern that your actions are genuine when you act in accordance with it.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which you need to convince others of, or leverage your faith in, Courtesy (such as a Performance check to recount a tale that impresses its importance upon others or a Martial Arts [Melee] check to take up arms for this cause), you may reroll up to two dice.</span></p></li></ul>"
  },
  {
   "name": "Dark Secret",
   "tag": "Anxiety",
   "ring": "void",
   "kind": "anxiety",
   "text": "<p><em>“I’m sorry that you saw that, Megumi-chan,” Kayoko said, her voice as soft as spider’s silk, her hands stained scarlet with blood.</em></p><p><em>A scream hung in Megumi’s throat, refusing to emerge. She could only stare in wide-eyed horror as Kayoko stepped closer.</em></p><p><em>“Power requires sacrifice, Megumi dear. That urchin has given her life for a higher purpose, and I have saved her from a lifetime of suffering. The power that I have gained will keep us all safe.”</em></p><p><em>Megumi tried to run, but her mind seemed disconnected from her body. Her pulse raced with the impulse to flee, but her legs would not obey.</em></p><p><em>Kayoko glided ever closer. “I can’t have you telling anyone, of course. I’m sure you understand…”</em></p><p><strong>Effects:</strong> The following apply to a character with the Dark Secret anxiety:</p><ul><li><p>-  You have a dark secret that, if exposed, could bring ruin upon your house and disgrace your ancestors and descendants alike. If the details of this secret become public, your glory value decreases dramatically, as if you had lost staked glory (by 10 to 20). Depending on the secret, your status value might also decrease considerably (by 5 to 10), as if you had lost staked status.</p></li><li><p>-  After performing a check to assert your will over yourself or others (such as a Command (void) check to order troops to fight to the bitter end or a Meditation (void) check to find inner peace), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Famously Successful",
   "tag": "Distinction",
   "ring": "fire",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“Victory will make even the most honorable of samurai forget the stains of your dishonor. Seize victory and your legend will speak only of your greatness. Akodo knew this, even if he dared not put it to words.”</em></span></p><p><span class=\"fontstyle2\"><em>– Bayushi Kiriko’s commentary on </em></span><span class=\"fontstyle3\"><em>Leadership</em></span></p><p></p><p><span class=\"fontstyle2\">The following apply to a character with the Famously Successful distinction:</span></p><ul><li><p><span class=\"fontstyle2\">- Other people have heard of you for your ability to get results at any cost, and they believe it by default unless given evidence to the contrary.</span></p></li><li><p><span class=\"fontstyle2\">- When performing a check for which you need to leverage your reputation for efficiency (such as a Courtesy (fire) check to convince your lord to give you a position or a Tactics (fire) check to get enemy troops to withdraw in the face of a show of force), you may reroll up to two dice.</span></p></li></ul>"

   "name": "Legal Scholarship",
   "tag": "Distinction",
   "ring": "air",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>Katatsune gleefully opened his newly bought Qamarist scroll. His fingers brushed over the bold, artistic calligraphy; the reflective golden edges; and the confident, red-and-black illustrations.</em></span></p><p><span class=\"fontstyle0\"><em>“Look how the text mirrors the falling of leaves. And here! The illustration of a frog. So whimsical!”</em></span></p><p><span class=\"fontstyle0\"><em>Nomolun chuckled. “This is what you came to Khanbulak for? Pretty pictures?”</em></span></p><p><span class=\"fontstyle0\"><em>“No, this is an expansive legal document on educational law—” He sheepishly looked up from the scroll. “And for the pretty pictures, yes.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Legal Scholarship distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- Your family possesses old legal documents not only on Rokugani law but also from other cultures, such as Qamarist law, and perhaps even local, provincial laws, such as a village elder’s edict not to use the well after midnight.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check when interacting with some legal body or using a legal code (such as a Government (air) check to use an obscure Qamari law regarding land rights or a Commerce (air) check to use an old Ujik agreement to renegotiate a trade), you may reroll up to two dice.</span></p></li></ul>"

   "name": "Paragon of Courage",
   "tag": "Distinction",
   "ring": "fire",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“The heroes of myth—even the ones who were not of divine blood—did not live as humans do. It is impossible to embody an ideal without surpassing some part of your own humanity.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Paragon of Courage distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You believe utterly in Courage, and others instinctively discern that your actions are genuine when you act in accordance with it.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which you need to convince others of, or leverage your faith in, Courage (such as a Performance check to recount a tale that impresses its importance upon others or a Martial Arts [Melee] check to take up arms for this cause), you may reroll up to two dice.</span></p></li></ul>"

   "name": "Emerald Magistrate",
   "text": "<p><span class=\"fontstyle0\">Emerald Magistrates are agents of the Emperor’s Law, warrior-sages who dispense wisdom and justice.</span></p><p><span class=\"fontstyle2\"><strong>Assigned By:</strong> </span><span class=\"fontstyle0\">The Emerald Champion, the Emperor, and other high-ranking officials in the office of the Emerald Champion can appoint Emerald Magistrates, and do so when a samurai proves worthy of the post or when the need arises for more arbiters of the Emperor’s Justice.</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+15 (to a maximum of 40)</span></p><p><strong>Title Ability:</strong> Voice of Authority</p><h2>Curriculum</h2><table><tbody><tr><td><p>Trade Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Fitness</p></td><td><p>Skill</p></td></tr><tr><td><p>Martial Arts [Choose One]</p></td><td><p>Skill</p></td></tr><tr><td><p>Performance</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-kata\">(kata) Rank 1–2 Kata</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-kata.Item.L5RCoreKat000026\" data-pack=\"l5r5e.core-techniques-kata\" data-type=\"Item\" data-id=\"L5RCoreKat000026\">(kata) Open-Hand Style</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000034\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000034\">(shuji) Shallow Waters</a> (prereq)</p></td><td><p>Technique</p></td></tr></tbody></table>",

   "name": "Shinjo Harunobu",
   "text": "<p><span class=\"fontstyle0\">Samurai are expected to place romantic love below their obligations to family and clan—but the human heart is not so easily confined. Many samurai who fall in love keep their relationship secret, while others are more overt. The following are suggested narrative effects for a character with a Lover bond:</span></p><ul><li><p><span class=\"fontstyle0\">- A lover seeks to spend time with you, writes letters to you, and is willing to assist you in ways that do not require publicly acknowledging your bond (giving you information key to pursuing a desired goal, encouraging you to pursue your personal interests, helping you to deal with emotions you usually must keep to yourself), and they expect you to do the same.</span></p></li><li><p><span class=\"fontstyle0\">Generally, your lover’s allies do not acknowledge your relationship. Some might be favorably disposed to you covertly if you make their ally happy (and unfavorably disposed if you make them unhappy), while others might be jealous of the attention you receive. Your lover’s enemies might target you to attempt to gain leverage over your lover.</span></p></li><li><p><span class=\"fontstyle0\">If your bond rank is 3 or higher, a lover is more overt about your relationship, allowing them to assist you more publicly (such as giving you letters of introduction to officials above your status, allowing you to use their name to pursue your goals, and even helping you directly), and they expect the same from you.</span></p></li></ul><p></p><p><span class=\"fontstyle3\"><strong>Bond Ability:</strong> With You, the Storm Subsides</span></p>"
  }
