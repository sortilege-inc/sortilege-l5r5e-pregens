  {
   "name": "Veiled Menace Style",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Assassination and other clandestine tactics are frowned upon by many samurai. None can deny the effectiveness of such techniques, however. By drawing their enemy’s gaze away from the true threat, a bushi can often tip the scales against a strong foe.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee] or Martial Arts [Unarmed] Attack action check using a weapon in a one-handed grip, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed, choose one unaware or Disoriented target of your action. That target suffers a critical strike with severity equal to your weapon’s deadliness plus 1 per (op) spent this way beyond the first</span>.</p>"

Trade skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li></ul><p><span class=\"fontstyle2\">If you fail, the GM chooses one of the above omens instead. The target cannot receive another divination until the next game session.</span></p><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle0\">: </span><span class=\"fontstyle2\">If you fail, an additional omen appears to you after the first. Choose one of the above omens in addition to the one the GM chose.</span></p>"

 threshold, you may protect the entirety of a sealed area that extends a number of range bands around you no greater than your bonus successes.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If any beings of the type you are attempting to seal the threshold against have passed through the threshold within the last twenty-four hours, you become aware of their passage.</span></p>"

   "ring": "water",
   "kind": "distinction",
   "text": "<ul><li><p><span class=\"fontstyle0\">You have proven yourself to a particular group, which is willing to help you when doing so will not damage its reputation. Its members will offer you their hospitality, including meals, a place to rest, and medical attention if they have a healer. They will also grant you access to their other facilities, such as libraries, smithies, or stables. Confer with the GM to select a campaign-appropriate group when choosing this advantage.</span></p><p></p></li><li><p><span class=\"fontstyle0\">When performing a check to interact with the members of the chosen group that relies on your rapport (such as a Command [Water] check to issue them orders or a Performance [Water] check to cause an audience of them to desire something), you may reroll up to two dice.</span></p></li></ul>"

  {
   "name": "Whispers of Doom",
   "tag": "Adversity",
   "ring": "void",
   "kind": "adversity",
   "text": "<p><em>Orphaned by the time she was six, Doji Hatsuhina was raised by her bachelor uncle, who also died when the girl was twelve. Finishing her schooling at the academies of Shizuka Toshi, Hatsuhina was betrothed to Seppun Hakemoto, a captain in the Imperial Guard, who died later that year. She was betrothed again, this time to a young Bayushi son of the Scorpion Champion, who was murdered as part of the often\u0002lethal politics of his clan. She was not betrothed a third time.</em></p><p></p><p>The following apply to a character with the Whispers of Doom adversity:</p><ul><li><p>- You are well-known, but not for the right reasons. Characters who do not know you personally always assume that those around you will perish or meet bad ends, even if you survive to spread your ill fortune further.</p></li><li><p>- When you make a check to dispel someone’s false preconceptions (such as a Courtesy (void) check to get someone to question their decision or a Command (void) check to get someone to see the pointlessness of their position), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"

   "tag": "Passion",
   "ring": "water",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>During the sixth month of the year after the biannual collection of taxes, the city of Ryokō Owari Toshi celebrates the Days of Generosity. As the festival begins, the head priest of the local temple draws a name in a lottery. The person whose name is drawn becomes “King of Generosity” and “rules” over the festival.</em></span></p><p><span class=\"fontstyle0\"><em>The festival is marked by gift giving and drunkenness. The festival king decides who the best gift giver is on each of the celebration’s three days. That person receives a portion of the “king’s purse,” a collection of coins given to the festival king to pay him for blessing the giver with a prosperous year ahead.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Generosity passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You can always identify a proper gift for a particular person that does not risk giving offense or slighting them publicly.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to acquire or give a gift (such as a Design (water) check to select an item that complements someone’s wardrobe or a Commerce (water) check to find and select a gift at a market), you remove 3 strife.</span></p></li></ul>"

   "name": "Claustrophobia",
   "tag": "Anxiety",
   "ring": "water",
   "kind": "anxiety",
   "text": "<p><em>“We can escape through here!” Her companion pointed down the narrow, crowded, suffocating alleyway. Her heart beat against her chest. Her vision refused to focus on their escape.</em></p><p><em>“Go on ahead. I will fend them off.”</em></p><p><em>“You are outnumbered twelve to one!”</em></p><p><em>I understand swords, she thought. I under stand blood and death. Her companion slid his way through the alleyway as their pursuers rounded the corner. I hope I will live long enough to understand my fear.</em></p><p><strong>Effects:</strong> The following apply to a character with the Claustrophobia anxiety:</p><ul><li><p>-  You are intensely afraid of being enclosed in a small space or a space without an easy exit. You avoid entering such places if at all possible, and you feel anxious and distracted while in such a place.</p></li><li><p>-  After making a check that requires to you enter an enclosed space (such as a Fitness (water) check to crawl through a narrow passage or a Survival (water) check to investigate a cave), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"

   "kind": "distinction",

   "tag": "Anxiety",
   "ring": "void",
   "kind": "anxiety",
   "text": "<p><em>“I’m sorry that you saw that, Megumi-chan,” Kayoko said, her voice as soft as spider’s silk, her hands stained scarlet with blood.</em></p><p><em>A scream hung in Megumi’s throat, refusing to emerge. She could only stare in wide-eyed horror as Kayoko stepped closer.</em></p><p><em>“Power requires sacrifice, Megumi dear. That urchin has given her life for a higher purpose, and I have saved her from a lifetime of suffering. The power that I have gained will keep us all safe.”</em></p><p><em>Megumi tried to run, but her mind seemed disconnected from her body. Her pulse raced with the impulse to flee, but her legs would not obey.</em></p><p><em>Kayoko glided ever closer. “I can’t have you telling anyone, of course. I’m sure you understand…”</em></p><p><strong>Effects:</strong> The following apply to a character with the Dark Secret anxiety:</p><ul><li><p>-  You have a dark secret that, if exposed, could bring ruin upon your house and disgrace your ancestors and descendants alike. If the details of this secret become public, your glory value decreases dramatically, as if you had lost staked glory (by 10 to 20). Depending on the secret, your status value might also decrease considerably (by 5 to 10), as if you had lost staked status.</p></li><li><p>-  After performing a check to assert your will over yourself or others (such as a Command (void) check to order troops to fight to the bitter end or a Meditation (void) check to find inner peace), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"
