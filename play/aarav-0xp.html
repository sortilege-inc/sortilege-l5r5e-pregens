  {
   "name": "Earth Needs No Eyes",
   "tag": "Kiho",
   "kind": "kiho",
   "text": "<p><span class=\"fontstyle0\"><em>The monk who waits and listens sees much, even without eyes. Sending out waves of their own energy and letting the ki of the life around them flow back into their body through the ground, the monk feels the reverberations of everything moving nearby, from the thunderous breaths of a warrior in battle to the footsteps of the tiniest ants.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Support action, you may activate this kihō. When you do so, you may make a </span><span class=\"fontstyle2\">TN 1 Meditation (earth) check </span><span class=\"fontstyle3\">to gain an awareness of your surroundings.</span></p><p><span class=\"fontstyle2\"><strong>Enhancement Effect:</strong> </span><span class=\"fontstyle3\">If you succeed, this kihō activates. While this kihō is active, you can use vibrations through the earth to “see” a number of range bands in all directions equal to your Earth Ring. While this kihō is active, increase your vigilance by your Earth Ring.</span></p><p><span class=\"fontstyle2\"><strong>Burst Effect:</strong> </span><span class=\"fontstyle3\">If you succeed with three or more bonus successes, you instantly become aware of all living creatures and objects touching the ground within a number of range bands equal to your Earth Ring plus your bonus successes.</span></p>"
  },

   "tag": "Kiho",
   "kind": "kiho",
   "text": "<p><span class=\"fontstyle0\"><em>The monk centers their ki, then reaches out and touches another character, counterbalancing their turbulent energies with the stillness of the monk’s own soul. This restores the character’s spirit, driving out poison, disease, and even the grip of evil spirits, provided they have not yet taken root in the character’s soul.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Support action, may make a </span><span class=\"fontstyle2\">TN 1 Theology (earth) check </span><span class=\"fontstyle3\">to bolster your spiritual resilience. When you perform this action, you may choose one other character at range 0–1 as the target for the burst effect.</span></p><p><span class=\"fontstyle2\"><strong>Enhancement Effect:</strong> </span><span class=\"fontstyle3\">If you succeed, this kihō activates. While this kihō is active, reduce the TN of all your checks to resist poison, disease, mahō, the Defiled terrain quality, and the effects of Otherworldly and Tainted beings by your Earth Ring.</span></p><p><span class=\"fontstyle2\"><strong>Burst Effect:</strong> </span><span class=\"fontstyle3\">If you have two or more bonus successes, remove one of the following conditions from your target: Afflicted, Bleeding, Dazed, Disoriented, Dying, Fatigued, or Intoxicated.</span></p>"

   "name": "Threshold Barrier",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist wards an entryway against beings of a certain sort, causing them to fail to observe the entryway or making them mentally repulsed by their efforts to enter it.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 2 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) targeting a threshold, gate, or other entryway at range 0–1.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, the threshold is barred against a particular type of entity, based on the ring you chose, for one hour, plus additional hours equal to your bonus successes. When an entity of this type attempts to enter, it must resist with a </span><span class=\"fontstyle2\">TN 3 Meditation (void) check </span><span class=\"fontstyle3\">or be repelled by the spiritual barrier. Whether it succeeds or fails, you immediately become aware of its attempted entry. The particular type of being is based on the ring you chose, as follows:</span></p><ul><li><p><span class=\"fontstyle2\">(air): </span><span class=\"fontstyle3\">Ethereal Otherworldly beings such as spirits and ghosts.</span></p></li><li><p><span class=\"fontstyle2\">(earth): </span><span class=\"fontstyle3\">Living Tainted beings.</span></p></li><li><p><span class=\"fontstyle2\">(fire): </span><span class=\"fontstyle3\">Undead beings with corporeal form.</span></p></li><li><p><span class=\"fontstyle2\">(water): </span><span class=\"fontstyle3\">Wild animals.</span></p></li><li><p><span class=\"fontstyle2\">(void): </span><span class=\"fontstyle3\">Humans.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Instead of protecting a threshold, you may protect the entirety of a sealed area that extends a number of range bands around you no greater than your bonus successes.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If any beings of the type you are attempting to seal the threshold against have passed through the threshold within the last twenty-four hours, you become aware of their passage.</span></p>"

   "text": "<p><span class=\"fontstyle0\"><em>“Perhaps you’d like to match your words with your steel,” the woman growled, her hands resting upon the hilts of her swords. “You will learn a hard lesson: nobody insults Mirumoto Ohatsu with impunity.”</em></span></p><p><span class=\"fontstyle0\"><em>The man she faced smiled in return.</em></span></p><p><span class=\"fontstyle0\"><em>“I certainly did not intend to offend you in any way, Ohatsu-san. Please allow me to introduce myself. I am Miya Matsuo. Perhaps you have heard of my cousin, the Imperial Herald?”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Blessed Lineage distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- Characters with status of 50 or higher understand that they might suffer a loss of prestige if they harm you, and thus do not choose to kill you as their first option, even if you are a political obstacle they would otherwise eliminate without hesitation.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which your esteemed lineage is a benefit (such as a Command (void) check to challenge someone’s perception of a situation or a Government (void) check to know the likelihood of a political eventuality), you may reroll up to two dice.</span></p></li></ul>"

   "ring": "fire",
   "kind": "adversity",
   "text": "<p><em>The Crane courtier bowed deeply, a thin, insincere smile upon his face. “I bring a thousand wishes for a glorious future from the Crane to the great Shinjo Aru…Arutan…”</em></p><p><em>“Altansarnai,” the Unicorn Champion corrected him. The courtier bowed further. “I apologize, Shinjo\u0002sama. A…lovely name, but one that falls oddly upon my tongue.”</em></p><p><em>“It is from the Ujik tongue. It means ‘golden rose.’” Altansarnai gestured for the courtier to join her where she was seated. We are still foreign to them, she thought, and they will never let us forget it.</em></p><p></p><p>The following apply to a character with the Gaijin Name, Culture, or Appearance adversity:</p><ul><li><p>- People of higher and equal status tend to assume that you are uneducated at best and a barbarian at worst, while people of lower status respond to you with fear.</p></li><li><p>- When you make a check to inspire others who do not share your culture or background (such as a Command (fire) check to rally troops or a Commerce (fire) check to create a product that people desire), you must choose and reroll two dice containing (su) or (ex) . After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"

   "tag": "Passion",
   "ring": "fire",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>“Even should a samurai evade death on the battlefield and survive to see their great-grandchildren come of age, one day they will pass. Such is the way of mortals. But the stories that people tell of that samurai—those may live forever.” The Ikoma historian gave his sibling a shrewd look.</em></span></p><p><span class=\"fontstyle0\"><em>“But you did not come to listen to the lectures I have for students, I suspect. You want to be the subject of my next lecture. Tell me of your accomplishments, and I will make sure they are recorded in the family histories.”</em></span></p><p><span class=\"fontstyle0\"><em>With that prompting, the eager bushi launched into a story about their efforts in the recent conflict, and they were not silent until late into the night.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Glorious Deeds passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You find risking your life to be a simple matter, as long as there is a witness to remember your bravery. No threat or challenge deters you if you might be remembered for it, making even the most daunting tasks easy ones for which to prepare.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to improve your reputation or gain fame as a great samurai (such as a Performance (fire) check to impress a court with your new melody, or a Tactics (fire) check to execute a daring raid on the enemy), you remove 3 strife.</span></p></li></ul>"

   "tag": "Anxiety",
   "ring": "fire",
   "kind": "anxiety",
   "text": "<p><em>“I have climbed the highest peaks in my quest: the Wrath of the Kami, Tenkenniyoru Yama, the Iron Mountain, the Northern Wall Mountains… Nothing!</em></p><p><em>Each tincture from a flower. Each tea from an herb. Each poultice from bark. Nothing. The answer must be out there.”</em></p><p><em>- letters from Agasha AriNaga regarding an elixir of immortality</em></p><p><em>“Falling up a mountain like AriNaga, to be immortalized as a fool.”</em></p><p><em>- old Agasha saying</em></p><p><strong>Effects:</strong> The following apply to a character with the Fear of Mediocrity anxiety:</p><ul><li><p>-  Your fear of amounting to nothing causes you to seize up when faced with the need to innovate on the fly.</p></li><li><p>-  After performing a check to adapt to an unexpected situation (such as a Survival (fire) check to find shelter when your tent is destroyed or a Culture (fire) check to unexpectedly interact in an appropriate manner with someone of a higher status), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"

   "text": "<p><span class=\"fontstyle0\"><em>Daidoji Shingen sauntered down the gangplank from the dock to his waiting vessel, a broad smile spreading across his face. His crew gathered around their returning captain.</em></span></p><p><span class=\"fontstyle0\"><em>“We have safe harbor here, and a fine market in which to sell our cargo. Start offloading.” The crew cheered, and set to work. Shingen’s first mate, Hiramichi Anjiro, remained behind, scratching his head idly.</em></span></p><p><span class=\"fontstyle0\"><em>“I don’t know how you managed that, Captain.” Shingen winked. “Let’s just say that the lady of the palace was kindly disposed toward a wayward sea captain.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Benten’s Blessing distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- After interacting with a character for one or more scenes, you know with certainty whether they are open to your romantic aspirations or if they are categorically uninterested.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which the favor of the Fortune Benten is a benefit (such as an Aesthetics (air) check to say something insightful about a piece of art or a Courtesy (air) check to convince someone of your positive qualities), you may reroll up to two dice.</span></p></li></ul>"

  {
   "name": "Wanderers Fellowship",
   "text": "<p><span class=\"fontstyle0\">With no lord, rōnin have nobody to rely upon and none to protect save themself, making their way through the world like waves rolling across the shore. But even the most independent-minded humans desire a degree of companionship, and there is a certain stability to be found in numbers. As a result, many rōnin form warrior bands, groups that work, fight, suffer, and laugh together. These bonds can become as tight as the tremendously strong bonds of family in Rokugan, or even stronger. In desperate circumstances, this bond can get a rōnin on their feet and back into the fight, helping them to fight on through the pain or face overwhelming odds to save their comrades in arms.</span></p><ul><li><p><span class=\"fontstyle0\">- Other members of your fellowship watch out for your safety (if not always your dignity, especially when it comes to telling embarrassing stories). They help you with modest favors (offering you a cut in on a job they have taken on, giving you an introduction to someone hiring rōnin, buying your sake when your purse is empty and theirs is less empty), and generally expect you to reciprocate such favors.</span></p></li><li><p><span class=\"fontstyle0\">- Those with whom your fellowship has worked before are generally inclined to regard you in the same way they do your fellows—if they are rowdy or well-behaved, they will assume the same of you. Your actions also reflect upon members of your fellowship, and if you step out of line such that it endangers the group’s reputation, they intervene to set you on the right path—or to remove you from the group, if you will not repent.</span></p></li><li><p><span class=\"fontstyle0\">- If your bond rank is 3 or higher, your fellowship’s bonds of loyalty are extremely deep, and other members will accept dangerous jobs with you without question, join your side in battles that do not pay, and perhaps even buy your sake without reminding you about it three times in the next week.</span></p></li></ul><p></p><p><span class=\"fontstyle3\"><strong>Bond Ability:</strong> Sworn to Duty and to Death</span></p>"

   "text": "<p><span class=\"fontstyle0\">The Ivory Kingdoms sidearm is the </span><span class=\"fontstyle2\">talwar</span><span class=\"fontstyle0\">, or “single-edged sword.” A curved saber with one sharp edge and a cross-guarded hilt with a knuckle-bow, it is designed to be wielded in a specialized one-handed grip. The sword’s hilt is bulb shaped, requiring that the sword be held differently than those forged by Rokugani. This and the blade’s unusual balance means that talwar fighting requires special training; attempting</span> <span class=\"fontstyle0\">to use the sword as one might a Rokugani blade can break the talwar or injure one’s wrist. However, when a talwar is wielded correctly, the wider cutting tip at the end of its blade affords it more cutting power, making this sidearm an especially deadly weapon.</span></p>"

   "text": "<p><span class=\"fontstyle0\">Daikyū are large composite bows designed to be fired from horseback. Conventionally around six feet long, these elegant weapons are constructed by gluing thin layers of wood, horn, leather, and sinew together. Daikyū differ from other bows in that they have an asymmetric shape. Their grip is about two-thirds of the way from the top, making the top curve longer than the bottom. This allows the bows to be fired easily from horseback in either direction. Each daikyū is made for a custom fit for a specific user.</span></p>"

   "rarity": "4",
   "text": "<p><span class=\"fontstyle0\">The gunbai, a leader or commander’s war fan, is a staple of samurai officers for communicating orders to their troops at a distance. Each gunbai is unique, as are the gestures the officers use to communicate orders to their troops. With a flick of the wrist, an officer may order their troops to fall back or to charge into the fray. Often gilded with metal, a gunbai is used to convey urgent tactical shifts and defensive moves.</span></p><p><span class=\"fontstyle0\">A gunbai can be wielded as a one-handed Martial Arts [Melee] weapon with the following profile: Range 1, Damage 2, Deadliness 2.</span></p><p><span class=\"fontstyle0\">During a skirmish, a character with a gunbai readied can perform shūji targeting characters who can see them at range 0–6 (as opposed to the usual auditory range restriction of range 0–4).</span></p><p><span class=\"fontstyle0\">During a mass battle, for each of an army’s leaders equipped with a gunbai, the army increases its discipline by 2.</span></p>"
