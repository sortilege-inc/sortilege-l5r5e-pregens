   "text": "<ul><li>A shugenja deeply attuned to the kami of water can see other places in watery reflections. Incredibly powerful practitioners can even use this reflection to transport themself and others to the desired place through the water—even if they arrive slightly damp.</li><li>As a Movement and Scheme action, make a TN 2 Theology (Water) check targeting one position containing a body of water at range 0-1.</li><li>If you succeed, you scry in the ripples. The target body of water displays an image of a second body of water of your choice and its surroundings as if the onlooker were just below the surface. The second body must be at range 0-6 and you must have concrete knowledge of it.</li><li>Water (op): You can also hear (very muffled) noises through the pool.</li><li>Water (op): Only you can see the vision; to others, the pool shows no images.</li><li>Water (op): The location can be any distance from you (but must still be familiar).</li><li>Water (op)(op): You may use clouds, fog banks, snow, or sheets of ice as bodies of water for this technique.</li><li>Water (op)(op)(op): You and a number of characters up to your Water Ring may pass through a temporary portal to the other location. One way only; you arrive soaked.</li></ul>"
