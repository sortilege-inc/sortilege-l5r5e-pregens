 "ninjo": "She longs to understand the true nature of her visions, and what purpose they are to serve.",
 "giri": "Tonbo Unkei, her daimyō, wants her to present the Dragonfly clan as an independent entity, not merely a vassal of the Dragon clan.",

 "techniques": [
  {
   "name": "Dominion of Suijin",
   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Iuchi's Window (Ancestral), All Rivers Meet Again (Elemental), Spies of the Garden Pond (Foreign)</p><p><em>A shugenja deeply attuned to the kami of water can see other places in watery reflections. Incredibly powerful practitioners can even use this reflection to transport themself and others to the desired place through the water—even if they arrive slightly damp.</em></p><p><strong>Activation:</strong> As a Movement and Scheme action, you may make a TN 2 Theology (water) check targeting one position containing a body of water at range 0–1.</p><p><strong>Effects:</strong> If you succeed, you scry in the ripples. The target body of water displays an image of a second body of water of your choice and its surroundings as if the onlooker were just below the surface. This second body of water must be at range 0–6 of the target position, and you must have concrete knowledge of a specific body of water to use it this way.</p><h4>New Opportunities</h4><p>(water)(op): In addition to being able to see out the other pool of water, you can hear (very muffled) noises.</p><p>(water)(op): Only you can see the vision; to others, the pool of water shows no images.</p><p>(water)(op): The location you see can be any distance from you (but must still be familiar).</p><p>(water)(op)(op): You may use clouds, fog banks, snow, or sheets of ice as bodies of water for this technique.</p><p>(water)(op)(op)(op): In addition to being able to see out of the other body of water, you and a number of other characters up to your Water Ring may pass through the temporary portal you have created to the other location. The trip is always one way for a given use of the technique, and you always arrive soaked.</p>"
  },
  {
   "name": "Reflections of P’an Ku",
   "tag": "Invocation",
   "kind": "invocation",
   "text": "<p>Agasha's Vast Wisdom (Ancestral), Rumors of the Water Kami (Elemental), Whispers of the Steel (Foreign)</p><p><em>Water kami are notoriously covetous, and things lost to the depths rarely resurface. Still, this avarice can offer advantages. A shugenja learned in this art can call forth water spirits to recognize an item by submerging it in sacred water. The water spirits often provide cryptic answers, but they usually can grant the shugenja a good idea of an item’s composition, whether it possesses any mystical properties, and the general disposition of these traits.</em></p><p><strong>Activation:</strong> As a Scheme action, you may make a TN 2 Theology (water) check targeting one item at range 0–1.</p><p><strong>Effects:</strong> If you succeed, you scry to uncover all properties an item possesses, including its name, maker, mundane qualities, magical properties, curses, and sealed techniques (see Nemuranai on page 307).</p><h4>New Opportunities</h4><p>(water)(op): Gain knowledge of the item’s origin in broad strokes, such as where it was forged, the clan of the individual who has carried it the longest, or a similar piece of information.</p><p>(water)(op): You may target a character instead of an object. If you succeed, you identify one invocation, kihō, mahō, or supernatural ability or item possessed by that person, along with its name and general qualities.</p><p></p>"
  },
  {
   "name": "Commune with the Spirits",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist centers their mind on one of the Elements, appealing to the spirits in their environment and seeking their counsel or boon. Priests and laypeople are able to use this ritual to receive less specific guidance from the spirits, such as a leaf that falls to the ground pointing in the direction of the person or thing they are seeking.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity or Support action, you may make a </span><span class=\"fontstyle2\">TN 1 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) to appeal to nearby spirits of that Element (appeal to the departed, such as ancestor spirits, and other non-elemental supernatural presences, if using (void)) for aid.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, choose and receive one of the following boons from the spirit or spirits you contacted:</span></p><ul><li><p><span class=\"fontstyle2\">- Sense the Kami: </span><span class=\"fontstyle3\">Detect all spirits and uses of their magic by shugenja within a number of range bands equal to the ring you used plus your bonus successes.</span></p></li><li><p><span class=\"fontstyle2\">- Spiritual Knowledge: </span><span class=\"fontstyle3\">Learn one fact the spirits know about the area.</span></p></li><li><p><span class=\"fontstyle2\">- Elemental Gift: </span><span class=\"fontstyle3\">The kami deliver a small amount of the Element in question to you. For instance, a prayer to a water kami might cause it to begin raining lightly, for a short time, but it might also cause you to run across a stream, or even find groundwater. In contrast, a prayer to fire kami might bring forth a small shower of sparks, while a prayer to an air kami might elicit a gust of wind. Praying to an earth kami might cause you to stumble across a large stone, or find a small patch of arable ground amid a wasteland. Prayers to the ancestors may allow the petitioner to find something that belonged to an ancestor in a time of need.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Reduce the TN of your next check to interact with or appeal to kami or supernatural presences of this Element by 1.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If you succeed, receive one additional boon per </span><span class=\"fontstyle6\">(op) </span><span class=\"fontstyle3\">spent this way. Each boon can only be received one time per activation.</span></p>"
  },
  {
   "name": "Divination",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\">The ritualist peers into a character’s future, ascertaining their fate from the patterns of the stars, the char marks upon animal bones, the placement of cast shells, or other omens they can read.</span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 2 Theology (void) check </span><span class=\"fontstyle3\">targeting one character to see glimpses of their future.</span></p><p><span class=\"fontstyle0\"><strong>Effects:</strong> </span><span class=\"fontstyle2\">If you succeed, choose one of the following omens that you see in the target’s near future:</span></p><ul><li><p><span class=\"fontstyle0\">- Omen of the Azure Dragon: </span><span class=\"fontstyle2\">The next time the target performs a check using a skill from the Artisan skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li><li><p><span class=\"fontstyle0\">- Omen of the Black Tortoise: </span><span class=\"fontstyle2\">The next time the target performs a check using a skill from the Scholar skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li><li><p><span class=\"fontstyle0\">- Omen of the White Tiger: </span><span class=\"fontstyle2\">The next time the target performs a check using a skill from the Martial skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li><li><p><span class=\"fontstyle0\">- Omen of the Vermilion Bird: </span><span class=\"fontstyle2\">The next time the target performs a check using a skill from the Social skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li><li><p><span class=\"fontstyle0\">- Omen of the Weaver and the Cowherd: </span><span class=\"fontstyle2\">The next time the target performs a check using a skill from the Trade skill group this game session, the target adds a kept (ring) set to an (op)(st) result.</span></p></li></ul><p><span class=\"fontstyle2\">If you fail, the GM chooses one of the above omens instead. The target cannot receive another divination until the next game session.</span></p><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle0\">: </span><span class=\"fontstyle2\">If you fail, an additional omen appears to you after the first. Choose one of the above omens in addition to the one the GM chose.</span></p>"

   "name": "Threshold Barrier",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist wards an entryway against beings of a certain sort, causing them to fail to observe the entryway or making them mentally repulsed by their efforts to enter it.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 2 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) targeting a threshold, gate, or other entryway at range 0–1.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, the threshold is barred against a particular type of entity, based on the ring you chose, for one hour, plus additional hours equal to your bonus successes. When an entity of this type attempts to enter, it must resist with a </span><span class=\"fontstyle2\">TN 3 Meditation (void) check </span><span class=\"fontstyle3\">or be repelled by the spiritual barrier. Whether it succeeds or fails, you immediately become aware of its attempted entry. The particular type of being is based on the ring you chose, as follows:</span></p><ul><li><p><span class=\"fontstyle2\">(air): </span><span class=\"fontstyle3\">Ethereal Otherworldly beings such as spirits and ghosts.</span></p></li><li><p><span class=\"fontstyle2\">(earth): </span><span class=\"fontstyle3\">Living Tainted beings.</span></p></li><li><p><span class=\"fontstyle2\">(fire): </span><span class=\"fontstyle3\">Undead beings with corporeal form.</span></p></li><li><p><span class=\"fontstyle2\">(water): </span><span class=\"fontstyle3\">Wild animals.</span></p></li><li><p><span class=\"fontstyle2\">(void): </span><span class=\"fontstyle3\">Humans.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Instead of protecting a threshold, you may protect the entirety of a sealed area that extends a number of range bands around you no greater than your bonus successes.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If any beings of the type you are attempting to seal the threshold against have passed through the threshold within the last twenty-four hours, you become aware of their passage.</span></p>"

  {
   "name": "Hero of [Village]",
   "tag": "Distinction",
   "ring": "fire",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>The children gathered around Sofu as he sat on the rock in the village square. “Akio stood up straight and tall. He beat his bare chest and roared, ‘I am no warrior, but I will make you all bleed.’”</em></span></p><p><span class=\"fontstyle0\"><em>A woman walking by glowered. “Tch. Sofu. Don’t tell them that story. It’s too bloody.”</em></span></p><p><span class=\"fontstyle0\"><em>“Do you want me to lie? This is a true story. The children need to know how Akio saved our village.”</em></span></p><p></p><p><span class=\"fontstyle0\">The following apply to a character with the Hero of [Village] distinction:</span></p><ul><li><p><span class=\"fontstyle0\">- You have a heroic reputation for deeds you undertook that benefited a particular village. The residents of that village do their best to aid you with any request you make (and praise you at every opportunity).</span></p></li><li><p><span class=\"fontstyle0\">- When performing a check for which your heroic reputation is a benefit (such as a Command (fire) check to rally peasants to defend their village against bandits or a Performance (fire) check to impress others with tales of your heroics), you may reroll up to two dice.</span></p></li></ul>"
  },
  {
   "name": "Lost Memories",
   "tag": "Adversity",
   "ring": "void",
   "kind": "adversity",
   "text": "<p><em>Utsuro bowed as he accepted the bowl, then sat back and ate with gusto. The simple food she brought him seemed to make him so happy. “You eat like you’ve never had rice balls before,” she laughed. “I don’t remember,” Utsuro reminded her. “Perhaps I haven’t!” </em></p><p><em>“I’ll bring you something else tomorrow,” she said, standing to go. “Yue,” said Utsuro. “My memories will come back some day.” </em></p><p><em>“I’m sure they will,” she said. Utsuro bowed again, and she went back to her home, climbed upon her table and lifted down the basket from the beams of her roof. She stared down at the robe Utsuro had been wearing when she found him, with its chrysanthemum crest. “But not too soon, I hope.”</em> </p><p></p><p>The following apply to a character with the Lost Memories adversity:</p><ul><li><p>-  There is a period of your life that you cannot remember at all. The less important this period is to your identity, the longer it should be (for example, a single day lost might be sufficient if the character committed a terrible act during that time and struggles to understand how or why, whereas a full decade of lost memories might be insufficient if they are not especially foundational to who the character is). The play\u0002er and GM should work together to determine the amount and importance of memories lost. Skills and abilities acquired during the lost time are largely retained, even if the character does not remember the act of developing them.</p></li><li><p>- When you make a check for which you must recall information you learned during the period of lost memories (such as a Culture (void) check to intuit how to behave in a particular situation similar or related to one you encountered during that time or a Meditation (void) check to understand your past decisions), you must choose and reroll two dice containing (su) or (ex) . After resolving the check, if you failed, you gain 1 Void point</p></li></ul>"

   "name": "Rock Gardening",
   "tag": "Passion",
   "ring": "void",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>Doji Kentarō allowed a tiny grin to sneak into his lips. He placed the stone—round, smooth, a comforting weight in his palm—gently in the middle of the rock garden. Though it stood out among the smaller, polished pebbles, it also belonged, a dark-gray shape amid the light-gray sea. </em></span><span class=\"fontstyle2\"><em>This stone is like me to my family.</em></span></p><p></p><p><span class=\"fontstyle0\">The following apply to a character with the Rock Gardening passion:</span></p><ul><li><p><span class=\"fontstyle0\">- You know the proper methods of arranging a rock garden (</span><span class=\"fontstyle2\">karesansui</span><span class=\"fontstyle0\">) according to popular manuals on the topic, and you can explain the symbolism and significance of different arrangements and features.</span></p></li><li><p><span class=\"fontstyle0\">- After performing a check related to rock gardening (such as an Aesthetics (void) check to detect a hidden meaning in a rock garden’s arrangement or a Meditation (void) check to make sense of events while reflecting on a rock garden), you remove 3 strife.</span></p></li></ul>"

   "name": "Claustrophobia",
   "tag": "Anxiety",
   "ring": "water",
   "kind": "anxiety",
   "text": "<p><em>“We can escape through here!” Her companion pointed down the narrow, crowded, suffocating alleyway. Her heart beat against her chest. Her vision refused to focus on their escape.</em></p><p><em>“Go on ahead. I will fend them off.”</em></p><p><em>“You are outnumbered twelve to one!”</em></p><p><em>I understand swords, she thought. I under stand blood and death. Her companion slid his way through the alleyway as their pursuers rounded the corner. I hope I will live long enough to understand my fear.</em></p><p><strong>Effects:</strong> The following apply to a character with the Claustrophobia anxiety:</p><ul><li><p>-  You are intensely afraid of being enclosed in a small space or a space without an easy exit. You avoid entering such places if at all possible, and you feel anxious and distracted while in such a place.</p></li><li><p>-  After making a check that requires to you enter an enclosed space (such as a Fitness (water) check to crawl through a narrow passage or a Survival (water) check to investigate a cave), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"

   "name": "Benten’s Blessing",
   "tag": "Distinction",
   "ring": "air",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>Daidoji Shingen sauntered down the gangplank from the dock to his waiting vessel, a broad smile spreading across his face. His crew gathered around their returning captain.</em></span></p><p><span class=\"fontstyle0\"><em>“We have safe harbor here, and a fine market in which to sell our cargo. Start offloading.” The crew cheered, and set to work. Shingen’s first mate, Hiramichi Anjiro, remained behind, scratching his head idly.</em></span></p><p><span class=\"fontstyle0\"><em>“I don’t know how you managed that, Captain.” Shingen winked. “Let’s just say that the lady of the palace was kindly disposed toward a wayward sea captain.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Benten’s Blessing distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- After interacting with a character for one or more scenes, you know with certainty whether they are open to your romantic aspirations or if they are categorically uninterested.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which the favor of the Fortune Benten is a benefit (such as an Aesthetics (air) check to say something insightful about a piece of art or a Courtesy (air) check to convince someone of your positive qualities), you may reroll up to two dice.</span></p></li></ul>"
  }
