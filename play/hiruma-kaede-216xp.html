   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Armies are rarely routed in the field; instead, most collapse when morale becomes impossible to maintain. As panic rises in the ranks, soldiers look to leaders to set an example. The character does just this, speaking to the importance of duty to bring their troops back from the edge of chaos.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Support action, you may make a </span><span class=\"fontstyle2\">TN 4 Command (earth) check </span><span class=\"fontstyle3\">targeting any number of characters (or your cohort during a mass battle).</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed during an intrigue, duel, or skirmish conflict, each target increases their composure by your Earth Ring. This effect persists until the end of the scene. If you succeed during a mass battle, increase your army’s discipline by your Earth Ring plus your bonus successes. This effect persists until the end of the scene.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(earth)(op)(op): </span><span class=\"fontstyle3\">During an intrigue, duel, or skirmish, each target removes strife equal to your Earth Ring.</span></p><p><span class=\"fontstyle2\">(earth)(op)(op): </span><span class=\"fontstyle3\">During a mass battle, your army removes panic equal to your Earth Ring.</span></p>"

   "kind": "kata",

le3\">(fire)(op): </span><span class=\"fontstyle2\">Choose a character in the conflict and one of their advantages you know. Until the end of their first turn, they apply that advantage to all of their checks.</span></p>"

  {

   "text": "<p><span class=\"fontstyle0\">When you defeat an opponent in a clash, your cohort removes panic equal to the opponent’s glory rank.</span></p><p><span class=\"fontstyle0\">Once per round when you succeed at an Attack action check during a mass battle, your cohort removes panic equal to half of the attrition you inflict.</span></p>"

  {
   "name": "Great Anvil's Measure",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A proud leader often draws attention to themselves in battle, and a leader both proud and skilled does so to draw their enemy into attacking them—especially when the enemy would rather attack elsewhere. When the leader’s troops are properly readied, and especially when they are in a highly defensible location, such an attack against them is doomed to fail.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a check to perform a Guard action in a skirmish (see page 264 of the core rulebook) or a Reinforce action in a mass battle (see page 279 of the core rulebook), you may spend (op) as follows:</span></p><p><span class=\"fontstyle2\">(earth)(op)+ (Guard): </span><span class=\"fontstyle3\">Choose any number of characters in the scene with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. Each chosen character must receive strife equal to your ranks in Performance to perform an Attack or Scheme action targeting any character other than you. This effect persists until the end of your next turn.</span></p><p><span class=\"fontstyle2\">(earth)(op)+ (Reinforce): </span><span class=\"fontstyle3\">Choose any number of leaders in the enemy army with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. The enemy army receives panic equal to your ranks in Performance each time any of those leaders performs an Attack or Scheme action targeting any cohort other than yours. This effect persists until the end of your next turn.</span></p>"

  {

   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>The character adapts something in their environment for use as an improvised weapon that suits their own fighting style. This might mean blocking hits with a chair like a shield, swinging a heavy branch like a club, or even wielding an umbrella with a swordmaster’s skill. Such improvised weapons rarely survive combat, but even if a broken sake bottle won’t hold an edge for long, a single good stab can often end a fight.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Movement and Support action, you may make a </span><span class=\"fontstyle2\">TN 2 Tactics (water) </span><span class=\"fontstyle3\">or </span><span class=\"fontstyle2\">Smithing (water) check </span><span class=\"fontstyle3\">using a readied improvised weapon.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you may choose a Martial Arts [Melee] weapon profile for a weapon similar in shape to the improvised weapon (the GM has discretion over whether the substitution is appropriate). Treat the improvised weapon as having that profile, with its damage and deadliness reduced by 1. This effect persists until the end of the scene, at which point the improvised weapon gains the Destroyed quality.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(water)(op)(op): </span><span class=\"fontstyle3\">You may immediately perform a Strike action using the readied weapon.</span></p><p><span class=\"fontstyle2\">(water)(op)(op)(op): </span><span class=\"fontstyle3\">If you succeed, choose one of the following item qualities: Cumbersome, Razor-Edged, or Snaring. The weapon is treated as having that quality.</span></p>"
  },
  {
   "name": "Iron in the Mountains Style",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>The bushi strikes with crushing force, breaking their enemy’s footing and knocking them to the ground with an overwhelming blow or sweeping their stance out from underneath them with a well-placed kick.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee, Ranged, or Unarmed] (Earth) check, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(earth)(op)+: </span><span class=\"fontstyle3\">One target of your action must resist with a </span><span class=\"fontstyle2\">TN 3 Fitness check ((air) 1, (water) 4) </span><span class=\"fontstyle3\">or suffer the Prone condition and fatigue equal to their shortfall. Increase the TN of the check to resist by 1 per (op) spent this way.</span></p>"
  },
  {
   "name": "Iron Shell Style",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>To defend against a single, predictable blow, a warrior can dig in, rooting themself and dispersing the force as it comes. Such a complete defense is exhausting to maintain, but it can keep a fighter on their feet when they otherwise would surely have fallen.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you perform a Guard action, if you have not moved any range bands this turn, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(earth) or (void)(op)+: </span><span class=\"fontstyle3\">Choose one character you can perceive per (op) spent this way. The next time you defend against physical damage from that character, your fatigue cannot be increased to a value greater than your endurance. This effect persists until the end of your next turn.</span></p>"
  },
  {
   "name": "Wanderer's Resolve",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A samurai with a lord can find resolve in the loyalty they feel, but a samurai with no lord has no easy wellspring from which to draw resolve. This hardship and isolation, however, can lead a rōnin</em></span><em> to discover a certainty</em><span class=\"fontstyle0\"><em> all their own, for if they do not act, no one else will. The lives of their friends—of those who depend on them—rest solely in their hands.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per scene as a Support action, if you are in a Void stance, you may focus on protecting what is important to you.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">You remove 3 fatigue and 3 strife, plus 3 fatigue and 3 strife for each Compromised or Incapacitated character in the scene with whom you share a bond (see </span><span class=\"fontstyle2\">Bonds</span><span class=\"fontstyle3\">, on page 187).</span></p>"

   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>The future is part of Void’s domain, infinite in possibility and unfathomable in depth. Because of its formlessness, one cannot scheme to undermine the uncertain future—but the instant it takes shape, an action is vulnerable to countermeasures. The bushi rests until the last possible second, allowing the potential energy of their strike to take shape only after it is too late for their enemy to respond.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee, Ranged, or Unarmed] (void) check, you may spend (op) in the following ways:</span></p><p><span class=\"fontstyle2\">(void)(op): </span><span class=\"fontstyle3\">Immediately switch to a different stance of your choice.</span></p><p><span class=\"fontstyle2\">(void)(op): </span><span class=\"fontstyle3\">If you fail, you may perform another action. This must be an action you have not yet performed this turn. You can only activate this opportunity once per round.</span></p>"

   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>To hit a target without seeing it is a masterful feat for any warrior who specializes in projectile weapons. Whether by firing through dense underbrush to hit a deer by the sound of its steps or banking a slingstone off a wall to hit a foe when you feel their heavy footfalls shake the floorboards, there are many ways to use one’s other senses to place a shot.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack and Movement action using a readied ranged weapon, you may make a </span><span class=\"fontstyle2\">Martial Arts [Ranged] (void) check </span><span class=\"fontstyle3\">targeting one character within your weapon’s range to whom you do not have direct line of sight. The TN of the check is equal to the target’s vigilance.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your target suffers physical damage equal to your weapon’s base damage and receives strife equal to your bonus successes.</span></p>"
  },
  {
   "name": "Battle in the Mind",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>As two masters of any martial art square off before a duel, each seeks to predict the other’s angle of attack and strategy, and the ways their predictions might be foiled by the opponent’s.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make an Initiative check for a duel using your Void Ring, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(void)(op)(op): </span><span class=\"fontstyle3\">You name two rings, then your opponent must name one of those two rings. When your opponent selects their stance during their first turn of the duel, they cannot select the ring they named as their stance.</span></p><p><span class=\"fontstyle2\">(void)</span><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Choose a technique category. Learn one of your opponent’s known techniques of that category (chosen by the opponent) per (op) spent this way</span>.</p>"
  },
  {
   "name": "Foreseen Need",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>Artisans with an open mind and an eye to the future are always working on things they may need one day. A little preparation and anticipation can pay off greatly at the right moment.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Support action, you may make a </span><span class=\"fontstyle2\">TN 1 Artisan (void) check</span><span class=\"fontstyle3\">.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you recall that you had foreseen the need for an item with a rarity equal to 1 plus your bonus successes on the check. Spend one Void point to instantly reveal one item you could have crafted, as long as it is reasonable (e.g., you could be carrying it on your person or have it in your quarters, you had access to the resources to craft it over the past month).</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Double the rarity of the target item, but the item must be of a perishable nature or one with only sentimental value.</span></p>"
  },
  {
   "name": "A Samurai’s Fate",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A leader asks their warriors for the final service all samurai must someday render to their lord: to lay down their lives that others might live. Even as they fall in battle, their shed blood waters the fields that will grow a thousand victories.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an action, you make a </span><span class=\"fontstyle2\">TN 5 Command (void) check </span><span class=\"fontstyle3\">targeting any number of characters (or your cohort, during a mass battle).</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed during a skirmish, each target ignores any critical strikes with severity lower than your Void Ring plus your bonus successes. This effect persists until the end of the scene (at which point the injuries take effect). If you succeed during a mass battle, your army counts as having the Fearless Army ability, below:</span></p><p><span class=\"fontstyle2\"><em>Fearless Army</em>: </span><span class=\"fontstyle3\">At the end of each round, your army removes panic equal to your glory rank. This effect persists until the end of the scene.</span></p>"
  },
  {
   "name": "Pillar of Calm",
   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>The character calls for reason to prevail and swords to be sheathed, appealing to a common ideal or greater threat that stands before the belligerent parties.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Scheme and Support action, you may make a </span><span class=\"fontstyle2\">Command (earth) check </span><span class=\"fontstyle3\">targeting a number of characters up to your Earth Ring times your school rank. The TN of this check is equal to the highest strife among the targets.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed while targeting all of the leaders involved in a conflict, you may de-escalate the conflict one level (from a mass battle to a skirmish, a skirmish to a duel, or a duel to an intrigue).</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(earth)(op)(op)+: </span><span class=\"fontstyle3\">You may de-escalate the conflict by one additional level per (op)(op) spent this way.</span></p>"
  },
  {
   "name": "Landslide Strike",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Lashing out at the foe’s legs, the warrior forces their enemy to either abandon their stance or be knocked from their feet. This tactic is especially effective on uneven ground, as the enemy must watch their footing or risk even further injury.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack and Scheme action, you may make a </span><span class=\"fontstyle2\">Martial Arts [Melee] ((earth) </span><span class=\"fontstyle3\">or </span><span class=\"fontstyle2\">(water)) check </span><span class=\"fontstyle3\">targeting one character in your weapon’s range. The TN is equal to the target’s vigilance. If your target is in Dangerous, Entangling, or Obscuring terrain, the TN is 1 instead.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your target must choose one of the following:</span></p><ul><li><p><span class=\"fontstyle3\">- Receive fatigue equal to your ranks in Fitness and the Prone condition.</span></p></li><li><p><span class=\"fontstyle3\">- Switch to a different stance of their choice and suffer the Immobilized condition.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If your weapon has the Cumbersome quality, choose one additional target with vigilance lower than or equal to your original target’s vigilance per (op)(op) spent this way.</span></p>"

   "kind": "kata",

  {
   "name": "Beseech Hida's Might",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>Contests of strength were a favorite of the Kami Hida, and even today, spiritualists in Rokugan call upon his blessing when sanctifying an area for ritualized battle. Whether the arena is a circle for sumai or a parting of the battle lines for a field duel, it is important that it be properly respected as a place for champions to take up arms.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session as a downtime activity or Support action, you may make a </span><span class=\"fontstyle2\">TN 2 Meditation (Fire) check </span><span class=\"fontstyle3\">targeting an area encompassing 3 range bands around yourself.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, this area becomes an </span><span class=\"fontstyle2\">arena</span><span class=\"fontstyle3\">. When a character makes a Martial Arts check in the arena during the event and does not gain strife from the check, that character reduces the TN of their next check by 1 (to a minimum of 1). This effect persists until the end of the next scene.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If you succeed, the arena gains the Hallowed (fire) terrain quality until the end of the scene.</span></p><p><span class=\"fontstyle2\">(op)+: </span><span class=\"fontstyle3\">If you succeed, increase the Endurance and Composure of each character fighting a duel in the arena by 1 per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Reduce the TN of checks to remove the Bleeding and Dying conditions from characters within the arena by 1 per (op) spent this way (to a minimum of 1).</span></p>"

   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist sanctifies a person or group, anointing them with sacred substances that drive out unholy presences and malign sorcery.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 3 Theology (void) check </span><span class=\"fontstyle3\">targeting up to five characters to remove spiritual contaminants from the targets before they spread. Note that this cannot remove a Shadowlands Taint disadvantage once it has taken hold, but it can prevent this spiritual contamination from taking root after a character is exposed.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, remove the Afflicted condition from the target.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If one or more targets is an Otherworldly being, you become aware of it after completing the ritual—but you do not know which target.</span></p><p><span class=\"fontstyle5\">(void)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Choose one additional target per (op) spent this way.</span></p><p><span class=\"fontstyle2\">(void)(op)+: </span><span class=\"fontstyle3\">Instead of targeting characters, you may target an area that encompasses a number of range bands around you equal to (op) spent this way. Remove the Defiled terrain quality from this area. If it is a deeply unhallowed place that has long been the domain of evil, the Defiled quality returns after one day, plus additional days equal to your bonus successes.</span></p>"

 "peculiarities": [
  {
   "name": "Light Sleeper",
   "tag": "Distinction",
   "ring": "water",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“You see these scars?” she asked. He nodded respectfully at the Hiruma. It looked like someone had run a rake down her face—then repeated the action several times.</em></span></p><p><span class=\"fontstyle0\"><em>“This is what you get when you dare slumber here. Everyone else died that night.” She closed her eyes for a moment, then opened them abruptly, startling him. “You rest your guard, you die.” She looked closely at him. “You learn to stay awake, even when you sleep. Or you join the rest of my old patrol.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Light Sleeper distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You rouse from sleep very easily, a trick considered essential in hostile territory. You are trained to awaken before danger arrives, sleep with your weapons ready, and pretend to be in a deep sleep to lure enemies closer. You can go from a deep sleep to fully alert and fighting in the blink of an eye.</span></p></li><li><p><span class=\"fontstyle0\">- When performing a check that calls on rapidly recovering from sleep (such as a Survival (water) check to detect a threatening sound while dozing or a Fitness (water) check to react even when someone else is standing watch), you may reroll up to two dice.</span></p></li></ul>"
  },
  {
   "name": "Encompassing Duty",
   "tag": "Adversity",
   "ring": "earth",
   "kind": "adversity",
   "text": "<p><em>“I will lay down my life for my family. Nothing will stand in the way of that.”</em></p><p><em>– Aina, Ashigaru of the Lion</em></p><p></p><p>The following apply to a character with the Encompassing Duty adversity:</p><ul><li><p>- You have a duty to something: your family, a friend, a cause, or some other person or ideal. This duty should manifest into at least one discernible goal, one you can work out with the GM. A goal may be to provide for your family, rescue a friend, or achieve a similar aim. You have a difficult time relaxing or focusing on tasks that do not somehow advance your goal, and this may manifest in several ways, including frustration, anger, worry, or nervousness. </p></li><li><p>- Whenever you make a check related to overcoming something that could hinder you in achieving your duty (such as a Meditation (earth) check to keep a cool head in an ambush or a Courtesy (earth) check to reason with a stubborn shopkeeper), you must choose and reroll two dice containing (su) or (ex) . After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"
  },
  {
   "name": "Travel",
   "tag": "Passion",
   "ring": "water",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>The old man sat heavily on the stool outside the constabulary office. He removed his straw hat, wiped his brow with his sleeve, and returned the hat to his head. His eyes, shaded by the wide brim, looked out at Yūka. The young girl smiled.</em></span></p><p><span class=\"fontstyle0\"><em>“Young lady, I have been from one side of Rokugan to the other—from Khanbulak to the Islands of Silk and Spice—and I have seen amazing sights. I will tell you this: in all my travels, I have become convinced of three things.” He counted them off on gnarled fingers. “All crows are black, it always rains when you don’t want it to, and Rokugan’s greatest treasure—a prize without equal—is its people.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Travel passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You are not unsettled by foreign customs, and you can comfortably fit in even in strange environments.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to travel to a new location or interact with a novel thing (such as a Survival (water) check to try to identify a new plant, animal, or phenomenon, or a Seafaring (water) check to travel by boat), you remove 3 strife.</span></p></li></ul>"
  },
  {
   "name": "Battle Trauma",
   "tag": "Anxiety",
   "ring": "fire",
   "kind": "anxiety",
   "text": "<p><em>The thousand cuts I have borne<br>And the thousand I have delivered<br>Paint my dreams in red<br>Broad brushstrokes to draw pictures<br>I cannot put to paper.<br>Do my ears ring from old age<br>Or is that steel’s song and the warrior’s cry<br>Gone so long ago<br>But never gone?</em></p><p><strong>Effects:</strong> The following apply to a character with the Battle Trauma anxiety:</p><ul><li><p>-  At the start of a duel, skirmish, or mass battle, your hands shake, your body tenses up, or your mind might even lock down. You can act normally, but your unsettled state is obvious to everyone around you, and others may try to exploit it.</p></li><li><p>-  After performing a check related to battle (such as a Martial Arts [Melee] (fire) check to strike down a foe or a Tactics (fire) check to generate initiative), you receive 3 strife. (Your GM can choose not to inflict this strife after the you have taken a few turns and thematically overcome your trauma.) If this is the first time this has occurred this scene, gain 1 Void point.</p></li></ul>"

   "name": "Paragon of Courage",
   "tag": "Distinction",
   "ring": "fire",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>“The heroes of myth—even the ones who were not of divine blood—did not live as humans do. It is impossible to embody an ideal without surpassing some part of your own humanity.”</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Paragon of Courage distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You believe utterly in Courage, and others instinctively discern that your actions are genuine when you act in accordance with it.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which you need to convince others of, or leverage your faith in, Courage (such as a Performance check to recount a tale that impresses its importance upon others or a Martial Arts [Melee] check to take up arms for this cause), you may reroll up to two dice.</span></p></li></ul>"

 "titles": [
  {
   "name": "Gunsō",
   "text": "<p><span class=\"fontstyle0\">While the vast majority of soldiers in a Rokugani army are ashigaru and conscripts, many samurai are called to military service, either in the armies of their own clan or in the Imperial Legions. When samurai do take to the field, they often these serve in leadership positions. While each lord's forces have their own structure and character, common titles are used throughout Rokugan to indicate similar levels of authority. When a lord gathers a large force for battle, they may nominate one or more gunsō to command the kashira who lead individual units.</span></p><p><span class=\"fontstyle0\">A gunsō is responsible for all aspects of battle readiness for the troops under their command, including the troops’ training, discipline, and equipment. When battle begins, gunsō direct their troops in accordance with commands from their superiors, meaning they have to maintain good awareness not only of their own unit but also of the broader battle unfolding around them. Perhaps most importantly, gunsō are expected to display conspicuous leadership during battle, leading their troops from the front and rallying their soldiers, keeping them in the fight even as losses mount and their morale begins to waver.</span></p><p><span class=\"fontstyle2\"><strong>Assigned By:</strong> </span><span class=\"fontstyle0\">A daimyō may assign a samurai a rank within their military forces, and samurai serving within the military rank structure may be promoted by a superior officer.</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+5 (to a minimum of 20)</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Lead from the Front</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Martial Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Command</p></td><td><p>Skill</p></td></tr><tr><td><p>Government</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-kata\">(kata) Rank 1-4 Kata</a></p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000020\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000020\">(shuji) Rallying Cry</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000026\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000026\">(shuji) Stirring the Embers</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-shuji.Item.L5RCoreShu000011\" data-pack=\"l5r5e.core-techniques-shuji\" data-type=\"Item\" data-id=\"L5RCoreShu000011\">(shuji) Touchstone of Courage</a> (prereq)</p></td><td><p>Technique</p></td></tr></tbody></table>",
   "ability": null,
   "abilityText": null
  },
  {
   "name": "General",
   "text": "<p><span class=\"fontstyle0\">The pinnacle of military command, a general serves as the mastermind behind all aspects of their army, seeing the will of their daimyō done through intricate planning and masterful stratagems. But there is more to a general’s duties. A general must lead by example; the expectations they have of their troops must be mirrored in their own actions. Their voice must electrify the souls of those under their command, inspiring them to charge enthusiastically to what may be their deaths. Their combat mastery must be without flaw. Their decorum and personal honor must be beyond reproach.</span></p><p><span class=\"fontstyle0\">Though it is a high honor to be given command, it can also be burdensome. Leadership is often a weary, isolating task. On their shoulders rest the will of their lord and the security of their homeland.</span></p><p><span class=\"fontstyle2\"><strong>Assigned by:</strong> </span><span class=\"fontstyle0\">A clan or family daimyō with a status of 60 or higher, often following a great military achievement by the character.</span></p><p><span class=\"fontstyle2\"><strong>Glory Award:</strong> </span><span class=\"fontstyle0\">+10</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">+25 (to a maximum of 85)</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Superior Command</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Social Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Martial Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Government</p></td><td><p>Skill</p></td></tr><tr><td><p>Survival</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-kata\">(kata) Rank 1-2 Kata</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-rituals\">(ritual) Rank 1-3 Rituals</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-shuji\">(shuji) Rank 1-4 Shuji</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr></tbody></table>",

   "rarity": "1",
   "text": "<p><span class=\"fontstyle0\">The humble club is perhaps the oldest weapon in Rokugan—at least among humans. Often little more than a length of stout wood or shaped stone, a club can be fashioned with available materials by nearly anyone. While a club can certainly be used to kill, doing so takes some work on the part of the wielder</span>.</p>"

   "rarity": "7",
   "text": "<p><span class=\"fontstyle0\">As much a work of art as it is a weapon, the katana is perhaps the most revered weapon in Rokugan. It has an elegant, slightly curved blade between three and four feet long, made of steel that is specially folded during its creation. This unique forging style ensures that the inner part of the blade remains springy and soft while the outside is as hard as tempered steel. Each sword likely has a history and legacy, and it is a constant reminder of the weight that destiny has placed upon its bearer’s shoulders as a samurai of Rokugan</span>.</p>"

   "text": "<p><span class=\"fontstyle0\">Long and narrow, a tetsubō can be as tall as a human and normally is constructed of iron or hardwood. Above its grip, a tetsubō is covered in steel, iron, or even jade spikes or studs that add to the weapon’s lethality and crush armor or plated carapace with ease.</span></p>"
