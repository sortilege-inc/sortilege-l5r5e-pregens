 "ninjo": "To see the rigid hierarchy that keeps the common people suffering finally brought low. Kunimichi has witnessed too much injustice perpetuated by the celestial order - peasants starving while nobles feast, talented individuals held back by birth, and the Emperor's divine mandate used to justify cruelty. He longs for a world where merit and compassion matter more than bloodline and divine favor. This desire constantly puts him at odds with his official duties, as he must publicly support the very system he secretly works to undermine.",
 "giri": "Daidoji Masahiro, a regional administrator who oversees border territories and trade routes. Kunimichi's official duty is to serve as an advance scout and intelligence gatherer, traveling ahead of diplomatic missions to assess threats and gather information about local conditions. His reputation for thoroughness and discretion makes him invaluable for sensitive assignments where the Crane need eyes and ears in unfriendly territory.",

  {
   "name": "Skulk",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>Shinobi are known for walking silently from shadow to shadow, moving like phantoms. Some of this relies upon agility and speed, of course, but veterans in the art of stealth know that using a crowd or another visual distraction to walk unnoticed can be as effective as the most complex acrobatics.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you perform an Initiative or Attack check using Air, you may spend (op) as follows:</span></p><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If you are in Obscuring terrain, a crowd, or otherwise concealed from sight, one character with vigilance lower than or equal to your ranks in Skulduggery loses sight of you.</span></p>"
  },
  {
   "name": "Striking as Air",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Not every stroke a warrior throws in battle is intended to kill—even if they all lead to that end goal. A skilled fighter can tell when an attack will not land and subtly shift it into a different sort of attack, meant to probe the enemy’s defenses or draw their guard out of position. By carefully placing attack after attack, a master of the blade can eventually whittle down their opponent’s options until none remain but death.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Martial Arts [Melee, Ranged, or Unarmed] (Air) check, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(air)(op)+: </span><span class=\"fontstyle3\">Reserve one of your rolled dice, plus one additional die per (op)(op) spent this way. These dice become dropped dice. When making a check with the same skill before the end of your next turn, you may roll one fewer (ring) per reserved (ring) and one fewer (skill) per reserved (skill), then add the reserved dice to your roll. These dice count as rolled dice, but are added set to the results they had when they were reserved.</span></p>"
  },
  {
   "name": "Explosive Arrival",
   "tag": "School Ability",
   "kind": "school_ability",
   "text": "<p><span class=\"fontstyle0\">After you perform an Attack action against a target who is Dazed or unaware of your presence, that target receives strife equal to your school rank. If your target is an enemy leader’s cohort in a mass battle, the enemy army also receives that much panic</span>.</p>"
  },
  {
   "name": "Swift Scouting",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>The line between a shinobi and a scout is mostly one of their current assignment. Yet, while traditional scouting can take days or weeks, sufficiently experienced survivalists who have lived in the wilds can undertake scouting missions much more quickly than typical observers. Shinobi must often spend long periods of time traveling Rokugan, hiding in the wilderness, or spying on targets on the road. As a result, many are intimately familiar with the sorts of environments found in those types of locations and can quickly sweep an area to identify the points of interest inside it. Especially skilled shinobi are likely to leave traps behind for enemy scouts or forces in the area.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, or once per scene as a Movement and Support action, you may make a </span><span class=\"fontstyle2\">TN 3 Survival (water) check </span><span class=\"fontstyle3\">to scout the terrain around you. If you activate this technique in an urban environment or on the ocean, use Skulduggery or Seafaring instead, respectively.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you discover all terrain qualities of the area around you (several miles in all direction during downtime, or the entire area in which the scene is occurring), as well as any fortifications in the area. Characters with vigilance lower than your Air Ring plus your bonus successes do not detect you during this time.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(water)(op)(op) </span><span class=\"fontstyle2\">(<em>Downtime</em> or <em>Mass Battle</em>): </span><span class=\"fontstyle3\">If you succeed, you may choose one part of the area (a single battle zone, if using the rules for battle zones) and add one of the following terrain qualities to that area: Confining, Dangerous, Entangling, Obscuring.</span></p><p><span class=\"fontstyle2\">(water)(op)(op) (<em>Other Scene</em>): </span><span class=\"fontstyle3\">If you succeed, you may choose a position in the area you scouted. Up to three range bands surrounding that position gain one of the following terrain qualities: Confining, Dangerous, Entangling, Obscuring.</span></p><p><span class=\"fontstyle5\">(water)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">You discover the location and composition of any enemy forces in the area led by characters with Air Ring lower than your vigilance plus (op) spent this way.</span></p><p><span class=\"fontstyle5\">(water)(op)(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">During your next turn, if you perform an action targeting an enemy cohort, ignore any fortification it is occupying. You may resolve effects as if you were inside that fortification.</span></p>"
  },
  {
   "name": "Trip the Leg",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>The bushi’s spear flashes out, aiming low to trip up their opponent and send the unlucky foe crashing to the ground.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack action using one readied polearm, you may make a </span><span class=\"fontstyle2\">TN 2 Martial Arts [Melee] check </span><span class=\"fontstyle3\">targeting one character at range 1–2.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, your target suffers the Prone condition.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(op): </span><span class=\"fontstyle3\">If you succeed, the target receives 2 fatigue and 2 strife.</span></p><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">If your target’s vigilance is lower than or equal to </span><span class=\"fontstyle5\">(op) </span><span class=\"fontstyle3\">spent this way, they suffer the Disoriented condition.</span></p>"
  },
  {
   "name": "Cautious Tread",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Horses and camels are excellent mounts, but their long legs make them somewhat more vulnerable to certain kinds of terrain than their human riders. A skillful handler knows how to lead their mount around the most dangerous spots, whether holes dug by rodents in the plains, swampy terrain, or chasms in the desert.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you make a Movement action check while riding a mount, you may spend (op) as follows:</span></p><p><span class=\"fontstyle2\">(op)(op): </span><span class=\"fontstyle3\">Choose one of the following terrain qualities: Dangerous, Entangling, or Obscuring. You and your mount ignore its effects. This effect persists until the end of your next turn.</span></p>"
  },
  {
   "name": "Employ Terrible Thunder",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>For some samurai, there is something they prize above honor: victory. For them, honor is meaningless if their lord is dead or their family lost. Any method that achieves victory is worthy, even if the Emperor themselves has outlawed it.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Movement and Support action, you may make a </span><span class=\"fontstyle2\">TN 4 Skulduggery check </span><span class=\"fontstyle3\">and expend 1 charge of blasting powder (see page 90) to place it in your environment at a target position at range 0–1 of you. You must forfeit honor equal to equal to half your honor rank (rounded up) to use this technique.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you set the blasting powder to explode at the end of the next round. Some or all of the following occur based on the scene type:</span></p><ul><li><p><span class=\"fontstyle3\">- (<em>Mass Battle</em>) Any nearby cohort (such as those in the same zone, if using the rules for zones on page 118) is caught by the blast, and that army receives 5 attrition and 5 panic, plus 1 per bonus success.</span></p></li><li><p><span class=\"fontstyle3\">- (<em>Mass Battle</em>) If you placed the blasting powder inside of a fortification (see the </span><span class=\"fontstyle2\">Fortifications </span><span class=\"fontstyle3\">sidebar on page 276 of the core rulebook), reduce its difficulty value by 1, plus 1 per bonus success.</span></p></li><li><p><span class=\"fontstyle3\">- (<em>Mass Battle</em>) One cohort leader affected by the explosion suffers the Immobilized and Lightly Wounded conditions.</span></p></li><li><p><span class=\"fontstyle3\">- (<em>Other Scene</em>) Each character at range 0–2 of the target position suffers 10 physical damage plus 1 per bonus success, suffers the Dazed condition, and receives 5 strife.</span></p></li><li><p><span class=\"fontstyle3\">- (<em>Other Scene</em>) Items at range 0–2 of the target position gain the Damaged item quality.</span></p></li><li><p><span class=\"fontstyle3\">- (<em>Other Scene</em>) Any structure (such as a bridge, house, or wall) at range 0–1 of the target position gains the Damaged quality.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\" style=\"color:rgb(0,0,0);\">: </span><span class=\"fontstyle3\">Any item or structure damaged by this effect gains the Destroyed quality instead.</span></p><p><span class=\"fontstyle2\" style=\"color:rgb(0,0,0);\">(op)(op): </span><span class=\"fontstyle3\">The area at range 0–2 of the position of the explosion gains the Dangerous and Obscuring terrain qualities, and flammable objects in the area are set ablaze.</span></p><p><span class=\"fontstyle2\">(op)+: </span><span class=\"fontstyle3\">The blasting powder does not detonate for one additional round per (op) spent this way.</span></p>"
  },
  {
   "name": "Staggering Shot",
   "tag": "Kata",
   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Putting an arrow at a foe’s feet can cause them to stumble or trip, and an experienced archer knows how to take full advantage of this, planting bolts to break an</em></span><em> </em><span class=\"fontstyle0\"><em>enemy’s stride or pinning their clothes to slow them down, making any approach extremely treacherous.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you perform a Martial Arts [Ranged] check, you may spend (op) in the following way:</span></p><p><span class=\"fontstyle2\">(earth) or (fire)(op)(op): </span><span class=\"fontstyle3\">Your target treats all terrain as having the Dangerous quality. This effect persists until the end of your next turn.</span></p><p><span class=\"fontstyle2\">(air) or (water)(op)(op): </span><span class=\"fontstyle3\">Your target treats all terrain as having the Entangling quality. This effect persists until the end of your next turn.</span></p>"
  },
  {
   "name": "The Patient Viper",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>Sometimes, the best way to approach a target is to stand still. Shinobi often lie in wait for hours or even days, patiently maintaining their position to ensure that they strike well when their foe arrives.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 4 Fitness (earth) check </span><span class=\"fontstyle3\">targeting your cohort </span><span class=\"fontstyle3\" style=\"color:rgb(0,0,0);\">(if you are currently the leader of a cohort) </span><span class=\"fontstyle3\">or yourself and a number of other characters up to your ranks in Command (in any other scene) who are within Dangerous, Entangling, or Obscuring terrain.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, all targets become hidden and are not noticed by characters with vigilance lower than or equal to your Earth Ring plus your bonus successes. These hidden characters cannot be the target of Attack actions. This effect persists until the end of your next turn, or until any target you have hidden performs an Attack or Movement action.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(earth)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">This effect persists for one additional round per (op) spent this way.</span></p><p><span class=\"fontstyle5\">(earth)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">Reduce the TN of the first Attack action check one of your targets makes against another character in the terrain in which your forces are hidden by 1 per (op) spent this way.</span></p>"
  },
  {
   "name": "Imbue Thunder",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>Fireworks are the sacred domain of specifically trained priests and spiritual artisans, and many among the Agasha and Asahina specialize in creating beautiful alchemical displays for festivals and other cultural events. These same techniques could, of course, be used to create blasting powder, but meddling in the domain of priests for purposes of waging war would surely constitute some form of blasphemy.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">To perform this ritual, you must first assemble the proper ingredients (charred wood, salt of earth, pollen that burns) in the proper proportions. One full set of materials costs 10 koku and has a rarity of 6, and is consumed by the process. Once per session as a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 4 Medicine check </span><span class=\"fontstyle3\">to properly mix the ingredients to create blasting powder.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you create ten brilliant flares (see 90), plus ten per two bonus successes, or one blasting powder charge (see page 90), plus one per two bonus successes.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">When used in a skirmish, the charge inflicts the Dazed condition on all characters at range 0–4.</span></p><p><span class=\"fontstyle5\">(air)(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">When used in a skirmish, increase the charge’s range band by 1.</span></p><p><span class=\"fontstyle5\">(earth)(op)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">When used, the charge inflicts 2 additional damage (or attrition) per (op)(op) spent this way.</span></p><p><span class=\"fontstyle5\">(fire)(op)(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">When used, the charge inflicts 2 additional strife (or panic) per</span><span class=\"fontstyle5\"> (op)(op) </span><span class=\"fontstyle3\">spent this way.</span></p><p><span class=\"fontstyle5\">(water)(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">When used in a skirmish, the charge inflicts the Bleeding condition on all characters at range 0–2.</span></p><p><span class=\"fontstyle5\">(void)(op)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">When used, the charge frightens away all kami in the radius of effect (or across the entire battlefield, in a mass battle). The affected area becomes Imbalanced (All Elements) terrain. This effect persists for 1 day.</span></p>"
  },
  {
   "name": "Wreak Havoc",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>While </em></span><span class=\"fontstyle2\"><em>Leadership </em></span><span class=\"fontstyle0\"><em>counsels against the needless destruction of the enemy’s assets—for these can become one’s own assets if seized—sometimes fire provides an avenue that subtler means could not. Baggage trains, fortifications, or even the tents of the wounded—for dishonorable commanders, any of these can make tempting targets for the flame.</em></span></p><p><span class=\"fontstyle3\"><strong>Activation:</strong> </span><span class=\"fontstyle2\">Once per game session as an Attack and Movement action during a mass battle, you may make a </span><span class=\"fontstyle3\">Skulduggery (Fire) check </span><span class=\"fontstyle2\">targeting one enemy leader’s cohort. The TN is equal to the vigilance of that cohort’s leader. You may expend 1 charge of blasting powder and forfeit honor equal to half your honor rank (rounded up) to reduce the TN by 2 (to a minimum of 1).</span></p><p><span class=\"fontstyle3\"><strong>Effects:</strong> </span><span class=\"fontstyle2\">If you succeed, you achieve one of the following:</span></p><ul><li><p><span class=\"fontstyle2\">- Reduce the difficulty value of a fortification the target is occupying by 4 plus your bonus successes. If this reduces the difficulty value to 0 or lower, the fortification is destroyed; any army with a cohort occupying it receives attrition equal to your bonus successes, and any leader or commander inside suffers a critical strike severity equal to 6 plus your bonus successes.</span></p></li><li><p><span class=\"fontstyle2\">- Remove the Confining and Entangling terrain quality from a fortification the target cohort occupies, but add the Dangerous and Obscuring terrain qualities to that area as it catches ablaze.</span></p></li><li><p><span class=\"fontstyle2\">- Remove one cohort ability from the target cohort. This ability is restored when the army resupplies (such as when making a maintenance check, as described on page 115). Additionally, if you succeed, the target leader must resist with a </span><span class=\"fontstyle3\">TN 5 Command check ((air) 6, (water) 3) </span><span class=\"fontstyle2\">or their army suffers panic equal to your ranks in Performance plus their shortfall.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(fire)(op)</span><span class=\"fontstyle3\">: </span><span class=\"fontstyle2\">If you succeed, the target cohort’s leader suffers a critical strike with severity equal to </span><span class=\"fontstyle2\" style=\"color:rgb(0,0,0);\">equal to 6 plus your bonus successes</span><span class=\"fontstyle2\">.</span></p><p><span class=\"fontstyle6\">(fire)(op)(op)</span><span class=\"fontstyle3\">: </span><span class=\"fontstyle2\">The target cohort’s leader suffers the Dazed condition.</span></p><p><span class=\"fontstyle6\">(fire)(op)</span><span class=\"fontstyle3\">+: </span><span class=\"fontstyle2\">If you succeed, you may expend a number of additional charges of blasting powder up to (op) spent this way to add two bonus successes per charge expended this way.</span></p>"
  },
  {
   "name": "Cunning Distraction",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>During a duel, the contestants are completely focused on each other’s smallest moves, waiting for the slightest signal that their opponent is going to strike. This gives unscrupulous duelists a chance to distract by reflecting the sun off a piece of jewelry or their weapon into their opponent’s eyes, flapping their kimono to simulate a sudden movement, or even kicking a small stone at their opponent’s feet. Particularly devious individuals can perform these distractions from the sidelines to aid an ally. All such actions are considered cheating… but only if someone notices.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a Scheme action during a duel or clash, you may make a </span><span class=\"fontstyle2\">TN 2 Skulduggery check </span><span class=\"fontstyle3\">targeting one character engaged in the duel or clash.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">Performing this action is cheating. Any character observing or engaging in the duel or clash with a vigilance of 2 or higher spots the cheating. If you succeed, during the next round of the duel or clash, both characters engaged in the duel or clash swap their initiative order.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(op)</span><span class=\"fontstyle2\">+: </span><span class=\"fontstyle3\">The vigilance required to spot the cheating is increased by 1 per (op) spent this way</span>.</p>"
  },
  {
   "name": "Deadly Sting",
   "tag": "Ninjutsu",
   "kind": "ninjutsu",
   "text": "<p><span class=\"fontstyle0\"><em>Poison is not a weapon an honorable samurai would choose, but it is tremendously effective, and like its namesake, the Scorpion Clan is not above envenoming its weapons to defeat foes it otherwise could not best.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As an Attack action, you may use one dose of a poison and make a </span><span class=\"fontstyle2\">TN 3 Martial Arts (air) check </span><span class=\"fontstyle3\">using a readied Concealable weapon targeting one character within the weapon’s range.</span></p><p><span class=\"fontstyle4\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, apply the chosen poison to your weapon (see page 244). Then, the target suffers physical damage equal to the deadliness of your weapon plus your bonus successes.</span></p><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(air)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Move 1 range band.</span></p><p><span class=\"fontstyle2\">(air)(op)+: </span><span class=\"fontstyle3\">If you succeed, the target suffers a critical strike with severity 2, plus 1 per (op) spent this way.</span></p>"
  },

   "tag": "Title Ability",
   "kind": "title_ability",
   "text": "<p><span class=\"fontstyle0\">When a fortification’s difficulty value would be reduced during a mass battle, the value is lowered by that amount plus your ranks in Labor instead. If there is a cohort occupying it, that cohort’s army suffers panic equal to your ranks in Skulduggery.</span></p>"

 "peculiarities": [

   "ring": "earth",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>When the lord came to see how the smith was proceeding on his sword, he found the smithy a shambles, the river running through the forge, and the smith with his robes tied up around his middle.</em></span></p><p><span class=\"fontstyle0\"><em>“Tsi-san,” said the great lord. “I trust my sword will be ready tomorrow, as we agreed?”</em></span></p><p><span class=\"fontstyle0\"><em>“Of course, great lord,” said the smith, bowing low. “This is only a minor setback.”</em></span></p><p><span class=\"fontstyle2\"><em>– The Trials of Tsi Wenfu, </em></span><span class=\"fontstyle3\"><em>author unknown</em></span></p><p></p><p><span class=\"fontstyle2\">The following apply to a character with the Famously Reliable distinction:</span></p><ul><li><p><span class=\"fontstyle2\">- Other people have heard of you for your remarkable adherence to your oaths and responsibilities, even over and above most samurai, and they believe it by default unless given evidence to the contrary.</span></p></li><li><p><span class=\"fontstyle2\">- When performing a check for which you need to leverage your reputation for keeping your oaths and bargains (such as a Command (earth) check to calm a panicked soldier or a Performance (earth) check to relate a tale that inspires patience), you may reroll up to two dice.</span></p></li></ul>"

   "name": "Kintsugi",

   "ring": "earth",
   "kind": "passion",
   "text": "<p><span class=\"fontstyle0\"><em>Mirumoto Kinshichirō did not cry then. As a child, he carelessly dropped this bowl, one that had been in his family for generations, a gift supposedly blessed by the actual Kami Togashi. His parents berated him, and he carried the guilt all throughout his adolescence. He even decided to study with the Agasha mystics, but his parents cared so little, they let him leave.</em></span></p><p><span class=\"fontstyle0\"><em>They did not realize that hidden in his belongings, a box contained the pieces of the bowl, carefully wrapped in a cloth. This box remined by his side as he studied, until Kinshichirō had to make his masterpiece. The bowl had broken into seven pieces, exactly the number of his siblings plus him, yet when he unfolded the cloth, he noted he only had six. The despair he felt only lasted for a little while.</em></span></p><p><span class=\"fontstyle0\"><em>When Kinshichirō returned home, he unveiled the bowl. He had joined the cracks with gold, and the missing space filled with a singular piece of jade with the family mon. His siblings welcomed him back, so he finally allowed the tears to flow.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Kintsugi passion:</span></p><ul><li><p><span class=\"fontstyle3\">- You have a particular fondness and skill for kintsugi, the art of mending broken pottery with gold or other similar substances.</span></p></li><li><p><span class=\"fontstyle3\">- After performing a check to mend an object with kintsugi or interact with a piece of kintsugi-repaired pottery (such as a Culture (earth) check to recall the name of a particular practitioner of kintsugi by their artist’s mark on a piece of pottery or a Labor (earth) check to produce a breathtaking piece), you remove 3 strife.</span></p></li></ul>"

   "text": "<p><span class=\"fontstyle0\">Akodo wrote that destroying fortifications mostly serves the satisfaction of generals who have had to besiege them, for earthworks should, when possible, be captured intact. However, the Kami of warfare knew the value of disabling key defenses to make fortresses indefensible, and wrote extensively of the use of sappers. To this day in Rokugan, sappers remain a critical part of most battles near fortifications, for an extended siege can easily ruin an entire campaign. Each generation of saboteurs trains the next, and only once a trainee has proven themselves in front of a number of their mentors are they accepted as a peer.</span></p><p><span class=\"fontstyle2\"><strong>Assigned by:</strong> </span><span class=\"fontstyle0\">Three other master saboteurs, who are usually members of a general’s command staff or found leading specialized clandestine units.</span></p><p><span class=\"fontstyle2\"><strong>Status Award:</strong> </span><span class=\"fontstyle0\">None</span></p><p><span class=\"fontstyle2\"><strong>Title Ability:</strong> Ender of Works</span></p><h2>Curriculum</h2><table><tbody><tr><td><p>Trade Skills</p></td><td><p>Skill Group</p></td></tr><tr><td><p>Government</p></td><td><p>Skill</p></td></tr><tr><td><p>Martial Arts [Unarmed]</p></td><td><p>Skill</p></td></tr><tr><td><p>Medicine</p></td><td><p>Skill</p></td></tr><tr><td><p><a class=\"compendium-link\" data-pack=\"l5r5e.core-techniques-ninjutsu\">(ninjutsu) Rank 1-2 Ninjutsu</a> (prereq)</p></td><td><p>Tech. Grp.</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-techniques-rituals.Item.L5RCoreRit000030\" data-pack=\"l5r5e.core-techniques-rituals\" data-type=\"Item\" data-id=\"L5RCoreRit000030\">(ritual) Imbue Thunder</a> (prereq)</p></td><td><p>Technique</p></td></tr><tr><td><p><a class=\"entity-link content-link\" draggable=\"true\" data-link=\"\" data-uuid=\"Compendium.l5r5e.core-t
