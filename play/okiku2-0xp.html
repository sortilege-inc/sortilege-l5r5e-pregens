   "text": "<p><span class=\"fontstyle0\">Perhaps the most common among foreign-designed swords found in Rokugan, scimitars were brought from the Burning Sands to the Emerald Empire by the Unicorn Clan. Often carried in place of the katana by those warriors, scimitars are heavy swords with a long, broad, curving blade. They possess a deadly cutting edge thanks to the extra surface area provided by their curvature.</span></p>"

   "rarity": "4",
   "text": "<p><span class=\"fontstyle0\">Among the Unicorn Clan’s many adopted weapons is a small, sturdy bow used by the nomadic peoples of the steppes far to the west. Called the Shinjo horsebow in Rokugan, this weapon is a compact bow designed to be fired from the back of a moving horse. It is a shortrange weapon intended for raiding and cavalry attacks</span>.</p>"

   "kind": "Item",
   "rarity": "1",
   "text": "<p>A quiver is a cloth or leather container used to carry arrows. Worn at the waist or slung over the shoulder, a standard quiver can hold sixty or more arrows. There are also quivers or equivalent carrying pouches for crossbow quarrels, blowgun darts, stones, and other ammunition, and they function in the same manner.</p><p data-start=\"414\" data-end=\"678\">As long as a character has a quiver of arrows available, they are assumed not to run out of standard ammunition. Further, the character is assumed to refill the quiver at reasonable opportunities, such as when visiting a guard outpost or a castle with an armory.</p><p data-start=\"680\" data-end=\"1009\">If a character goes an especially long time without having a reasonable opportunity to refill their quiver, the GM may state that the quiver is running low, with only 3 standard pieces of ammunition remaining; the character then gains 1 Void point. The character still possesses any special arrows they had prior to this point.</p><p data-start=\"1011\" data-end=\"1245\" data-is-last-node=\"\" data-is-only-node=\"\">A depleted quiver can be refilled by visiting a location where the character can acquire ammunition, or by making ammunition using the Survival skill if the character has the proper supplies (see page 169). (Cost: 20 zeni. Rarity: 1.)</p>"

   "kind": "Item",
   "rarity": "5",
   "text": "<p>Bigger than basic tents but not as big or luxurious as chomchong, yurts were brought to Rokugan from the far-off steppes by the Unicorn Clan. Made from thick leather or canvas with a felt floor, a yurt can house a group of four indefinitely in relative comfort. They are heavy and awkward to build or take down, and require either a horse or oxen dedicated to carting them around. (Cost: 10 koku. Rarity: 5.)</p>"

   "name": "Travel Rations",
   "kind": "Item",
   "qualities": [
    "Mundane"

   "rarity": "1",
   "text": "<p>In a land so vast, it is no small wonder that the Rokugani have developed significant food-preservation techniques to facilitate lengthy travels. Most travel foods are prepared so as to be easily stored and carried, as well as to last for long periods without spoiling.</p><p data-start=\"273\" data-end=\"621\">The typical traveling ration is a portion of uncooked husked rice, dried or pickled vegetables, and a small portion of a flavoring agent, such as dried seaweed or bonito flakes. Wealthy travelers may spring for a small paper container of sanshō, ground berries of the prickly ash plant that lend a peppery, minty, slightly acidic flavor to foods.</p><p data-start=\"623\" data-end=\"877\">Other common traveling foods include onigiri, or rice balls, which are commonly carried in bamboo sheaths by travelers for a quick meal. Onigiri are made of cooked sticky rice wrapped around a plum or fish filling and hand-molded into a circular shape.</p><p data-start=\"879\" data-end=\"1259\">Vinegared rice, used in sushi, is a common preserving element for fish. Indeed, sushi began as a preserving technique in which thin layers of fish were sandwiched between two layers of sushi rice, the vinegar acting as a pickling agent. Fish is also smoked or dried and then packaged into small boxes with miso paste (fermented soybean paste), which also acts as a preservative.</p><p data-start=\"1261\" data-end=\"1673\">Sometimes seaweed or soy sprouts are ground and mixed with barley and salt to make hishio, a thick paste used to pickle vegetables or fish for travel. The paste is scraped off, and the pickled food is eaten alone or in stews. Adding water to the hishio paste results in soy sauce (shoyu), which serves as a salty condiment. Aged and “brewed” shoyu is prized, but it is usually only affordable for clan samurai.</p><p data-start=\"1675\" data-end=\"1963\">Beans are an especially important travel food, as they are relatively lightweight when dried and last for long periods of time, but plump up into hearty, morale-restoring stews when cooked. Black and green beans are the most common, as are soybeans, broad beans, and sweet adzuki beans.</p><p data-start=\"1965\" data-end=\"2205\" data-is-last-node=\"\" data-is-only-node=\"\">In some regions, ropes used to secure goods are made from edible fibrous tuber stalks that are “dried” with miso. These ropes are completely edible and can be chopped and boiled when necessary. (Cost: 1–3 bu. Rarity: 1. Qualities: Mundane.)</p>"
