   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>The enigmatic Kami Togashi was said to have the ability to see the future, by which provenance he excused himself from the Tournament of the Kami. Occasionally he appears to his descendants, the members of the Dragon Clan, in flashes of visions or sudden, unexplained bursts of insight. Whether those who hear the voice of Togashi himself are truly in contact with their progenitor, channeling his essence across the ages, or are letting their imaginations run a bit too wild is a topic of discussion among the Dragon’s scholars.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">Once per game session as an action, you may make a </span><span class=\"fontstyle2\">TN 2 Meditation (void) check </span><span class=\"fontstyle3\">to seek cosmic wisdom regarding a quandary in front of you.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you receive a brief vision or hear the voice of Togashi providing a hint regarding one way you might proceed (which the GM should furnish). This hint should not be the full answer, but it should help you move forward toward a solution or at least formulate a plan of action.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle2\">(void)(op): </span><span class=\"fontstyle3\">Reduce the TN of your first check to overcome the problem you are facing by your school rank (to a minimum of 1).</span></p>"

   "text": "<p><span class=\"fontstyle0\"><em>The childbirth assistant carried the silent bundle to the priest outside of the birthing chamber. The child’s grandmother followed with a stony look on her face.</em></span></p><p><span class=\"fontstyle2\"><em>Why isn’t the child crying? </em></span><span class=\"fontstyle0\"><em>the priest thought.</em></span></p><p><span class=\"fontstyle0\"><em>“Show him,” the grandmother said.</em></span></p><p><span class=\"fontstyle0\"><em>The assistant carefully unwrapped the bundle. The unnerving infant stared about, clear-eyed, as the grandmother pointed out the seven moles in a perfect circle on their ear.</em></span></p><p><span class=\"fontstyle0\"><em>“The child will reverse the family’s bad fortune!” the priest exclaimed. The grandmother let out a breath and smiled for the first time in years.</em></span></p><p></p><p><span class=\"fontstyle2\">The following apply to a character with the Portentous Birth distinction:</span></p><ul><li><p><span class=\"fontstyle2\">- You are known among your clan or family group to have been born under blessed circumstances or have had some sort of mark or other indication of greatness bestowed upon you by the Heavens. When you interact with someone who knows of your portentous birth and believes in its power, they treat you favorably and may be inclined to give you special privileges as long as you do not give them a reason to treat you otherwise.</span></p></li><li><p><span class=\"fontstyle2\">- When performing a check for which your fortuitous birth is an asset (such as a Composition (fire) check to craft a clever request to someone who believes in the legacy of your birth or a Theology (fire) check to theorize about an omen), you may reroll up to two dice.</span></p></li></ul>"
