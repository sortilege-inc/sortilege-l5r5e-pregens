   "kind": "kata",
   "text": "<p><span class=\"fontstyle0\"><em>Striking first is valuable, but so is surviving. To defend without sacrificing offense, a bushi must be ready to retaliate swiftly after blocking or evading. With a quick shift, the bushi switches from defense to bring down their full force upon their enemy.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">When you perform Guard action (see page 264), you may spend </span><span class=\"fontstyle4\">(op) </span><span class=\"fontstyle3\">in the following way:</span></p><p><span class=\"fontstyle4\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">After a character at range 1–2 performs an Attack action targeting you or another character you are guarding, you may perform a Strike action with one readied Martial Arts [Melee or Unarmed] weapon targeting that character (if they are within your weapon’s range). This effect persists until the start of your next turn, or until you perform a Strike action this way.</span></p>"

   "tag": "Distinction",
   "ring": "earth",
   "kind": "distinction",
   "text": "<p><span class=\"fontstyle0\"><em>Many children’s stories feature tales of giants. They are said to live in distant lands, but none have ever been seen in Rokugan. If you were to ask the children of the City of Remembrance, however, they would swear that they have one in their town.</em></span></p><p><span class=\"fontstyle0\"><em>Isonashi, a samurai who serves the governor of the city, stands nearly double the height of an average man and is easily three times as broad. He wields an immense naginata built specifically for his size. If he is not a giant, he’s the closest thing to one anyone in Rokugan has ever seen.</em></span></p><p></p><p><span class=\"fontstyle3\">The following apply to a character with the Large Stature distinction:</span></p><ul><li><p><span class=\"fontstyle3\">- You can easily reach objects on high shelves, are easy to spot in a crowd, can see over other people, and tend to hit your head on doorways.</span></p></li><li><p><span class=\"fontstyle3\">- When performing a check for which you can take advantage of your size (such as a Fitness (earth) check to hold up a heavy object or a Labor (earth) check to build the frame of a house), you may reroll up to two dice.</span></p></li></ul>"

   "ring": "earth",
   "kind": "adversity",
   "text": "<p><em>The two bushi huddled together in the base of an ancient tree for warmth in the haunted forest of Hito\u0002kage Tani. They had heard rumors of a monster and wanted to test their mettle.</em></p><p><em>“If you say one word about a bath…” Etsuko mut\u0002tered with gritted teeth.</em></p><p><em>“Let’s just defeat the monster quickly so we can go have a—” Agasha Rie clamped their mouth shut with a clack of teeth.</em></p><p><em>Etsuko did not chide her friend, who ached from the last tussle with the monster. No major injuries, but the thing had been powerful, as if the earth itself had come alive. Fighting bandits is one thing. The bushi understood humans. This, however, made them prey.With a roar, the creature burst out from underneath, knocking Rie into the dirt.</em></p><p></p><p>The following apply to a character with the Stalked by (creature) adversity:</p><ul><li><p>-  You believe a creature of some kind is stalking you, whether or not that is true. The creature may be mundane or supernatural, and its obsession with hunting you makes being in the wilderness dangerous.</p></li><li><p>-  When you make a check that requires patience while in the wilderness (such as a Skulduggery (earth) check to build a trap to protect your camp or a Fitness (earth) check to stay calm while fleeing from the beast), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.</p></li></ul>"

   "text": "<p><span class=\"fontstyle0\"><em>Rie sighed, a loud exhalation of tension bordering on an ecstatic prayer to the Heavens, the woes of the road drifting away as their body slipped into the warm water. Their companion approached and, unceremoniously, plopped down next to them. “Etsuko-san!” said Rie. “You can’t just sit down without washing first: it’s uncouth!”</em></span></p><p><span class=\"fontstyle0\"><em>The woman frowned. “If you love the formalities of </em></span><span class=\"fontstyle2\"><em>onsen </em></span><span class=\"fontstyle0\"><em>so much, you should reincarnate as a bathhouse attendant.”</em></span></p><p><span class=\"fontstyle0\"><em>Rie couldn’t help but smile. “Imagine being able to bathe whenever we want. The heimin working here must be truly blessed.”</em></span></p><p></p><p><span class=\"fontstyle2\">The following apply to a character with the Bathing passion:</span></p><ul><li><p><span class=\"fontstyle2\">- You are familiar with all of the nuances of bathhouses and the traditions of bathing, and are talented at overhearing gossip in such places.</span></p></li><li><p><span class=\"fontstyle2\">- After performing a check while bathing (such as a Sentiment (water) check to eavesdrop on a conversation or a Composition (water) check to ponder how to improve a poem), you remove 3 strife.</span></p></li></ul>"

  {
   "name": "Protector and Ward",
   "text": "<p><span class=\"fontstyle0\">Most rōnin are responsible only for themselves, but some take up the life of a wanderer for the sake of another. A rōnin might have forsworn their rank and stature to protect the lost heir of their lord, hiding the child from those who see them as an inconvenient loose end—or they might have been the one to refuse such an order, and fled to protect someone their own lord desired to see dead. Or perhaps they simply encountered someone who needed them and their compassion forced its way through the rōnin’s worldweary exterior. Whatever the case, a character with this bond has someone who</span> <span class=\"fontstyle0\">is dependent on them, and looks to them both for guidance and protection in a harsh world.</span></p><p><span class=\"fontstyle0\">If you are the protector, your ward is reliant on you, and cannot fully fend for themself in the world, either due to their age, health, or circumstances. However, they are generally eager to help you to the best of their abilities.</span></p><p><span class=\"fontstyle0\">If you are the ward, your protector generally seeks to act in your best interests and keep you safe.</span></p><ul><li><p><span class=\"fontstyle0\">- Enemies of your ward view you as an impediment, and likely target you even before they target your ward, knowing that you will interfere with their plans anyway. Allies of your ward view you positively, and may even feel a great debt to you, assisting you in your quest to protect your ward with significant favors ­such as hiding you from your enemies, helping you acquire equipment, or giving you contacts in new places), within their means.</span></p></li><li><p><span class=\"fontstyle0\">- If your bond rank is Î or higher and you are the protector, you can always instinctively sense if your ward is in danger. Additionally, your ward begins to learn some skills from you more readily; if they are an NPC, they acquire 1 rank in 2 skill groups in which you possess 3 or more skill ranks. Your ward also starts to act on their own initiative to help you, and might even start to get you out of trouble!</span></p></li><li><p><span class=\"fontstyle0\">- If your bond rank is 3 or higher and you are the ward, your protector can instinctively sense if you are in danger. Additionally, your protector begins to take an interest not just in your safety, but in the things you do for fun; if they are an NPC, they acquire 1 rank in 2 skill groups in which you possess 3 or more skill ranks, and go out of their way to look out for your happiness in addition to your safety.</span></p></li></ul><p></p><p><span class=\"fontstyle3\"><strong>Protector Bond Ability:</strong> Under My Protection</span><br style=\" font-style: normal; font-variant: normal; font-weight: normal; letter-spacing: normal; line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; \"></p><p><span class=\"fontstyle0\"><strong>Ward Bond Ability:</strong> I’ve Been Learning</span></p>"

   "name": "Quiver of Arrow",
   "kind": "Item",
   "rarity": "1",
   "text": "<p>A quiver is a cloth or leather container used to carry arrows. Worn at the waist or slung over the shoulder, a standard quiver can hold sixty or more arrows. There are also quivers or equivalent carrying pouches for crossbow quarrels, blowgun darts, stones, and other ammunition, and they function in the same manner.</p><p data-start=\"414\" data-end=\"678\">As long as a character has a quiver of arrows available, they are assumed not to run out of standard ammunition. Further, the character is assumed to refill the quiver at reasonable opportunities, such as when visiting a guard outpost or a castle with an armory.</p><p data-start=\"680\" data-end=\"1009\">If a character goes an especially long time without having a reasonable opportunity to refill their quiver, the GM may state that the quiver is running low, with only 3 standard pieces of ammunition remaining; the character then gains 1 Void point. The character still possesses any special arrows they had prior to this point.</p><p data-start=\"1011\" data-end=\"1245\" data-is-last-node=\"\" data-is-only-node=\"\">A depleted quiver can be refilled by visiting a location where the character can acquire ammunition, or by making ammunition using the Survival skill if the character has the proper supplies (see page 169). (Cost: 20 zeni. Rarity: 1.)</p>"

   "kind": "Item",
   "rarity": "5",
   "text": "<p>Shinobi often must keep strange schedules. On castle missions, they sometimes stay up all night to gather information or harass foes after spending a day working in disguise. In the wilderness, they must remain alert for long periods of time when working as scouts or sentries. Herbal medicines, kept in pill form in small medicine cases or as tea brews, allow the shinobi to stave off hunger, thirst, drowsiness, or pain.</p><p data-start=\"512\" data-end=\"790\">At the end of a scene, a character with the Exhausted condition may use one dose of herbal medicine to remove strife and fatigue as if they were not Exhausted. They cannot benefit from this effect again until they remove the Exhausted condition. (Cost: 1 bu per dose. Rarity 5.)</p>"
