  {
   "name": "Threshold Barrier",
   "tag": "Ritual",
   "kind": "ritual",
   "text": "<p><span class=\"fontstyle0\"><em>The ritualist wards an entryway against beings of a certain sort, causing them to fail to observe the entryway or making them mentally repulsed by their efforts to enter it.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 2 Theology check </span><span class=\"fontstyle3\">using (air), (earth), (fire), (water), or (void) targeting a threshold, gate, or other entryway at range 0–1.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, the threshold is barred against a particular type of entity, based on the ring you chose, for one hour, plus additional hours equal to your bonus successes. When an entity of this type attempts to enter, it must resist with a </span><span class=\"fontstyle2\">TN 3 Meditation (void) check </span><span class=\"fontstyle3\">or be repelled by the spiritual barrier. Whether it succeeds or fails, you immediately become aware of its attempted entry. The particular type of being is based on the ring you chose, as follows:</span></p><ul><li><p><span class=\"fontstyle2\">(air): </span><span class=\"fontstyle3\">Ethereal Otherworldly beings such as spirits and ghosts.</span></p></li><li><p><span class=\"fontstyle2\">(earth): </span><span class=\"fontstyle3\">Living Tainted beings.</span></p></li><li><p><span class=\"fontstyle2\">(fire): </span><span class=\"fontstyle3\">Undead beings with corporeal form.</span></p></li><li><p><span class=\"fontstyle2\">(water): </span><span class=\"fontstyle3\">Wild animals.</span></p></li><li><p><span class=\"fontstyle2\">(void): </span><span class=\"fontstyle3\">Humans.</span></p></li></ul><h4><span class=\"fontstyle5\">New Opportunities</span></h4><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Instead of protecting a threshold, you may protect the entirety of a sealed area that extends a number of range bands around you no greater than your bonus successes.</span></p><p><span class=\"fontstyle6\">(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If any beings of the type you are attempting to seal the threshold against have passed through the threshold within the last twenty-four hours, you become aware of their passage.</span></p>"

   "tag": "Shuji",
   "kind": "shuji",
   "text": "<p><span class=\"fontstyle0\"><em>A skilled leader’s task is to guide their forces to victory, and sometimes, this means misleading them away from defeat. When an army is demoralized, when the odds are harsh, when the foe truly is stronger—these are the times a leader may need to spin a tale of the enemy’s weakness, of coming allies, or of a secret plan to guarantee success. The line between falsehood and truth may be dim or bright; regardless, sometimes warriors need hope to struggle on, even if that hope is forlorn.</em></span></p><p><span class=\"fontstyle2\"><strong>Activation:</strong> </span><span class=\"fontstyle3\">As a downtime activity, you may make a </span><span class=\"fontstyle2\">TN 4 Performance (air) check </span><span class=\"fontstyle3\">targeting an army or a number of characters who can hear you up to your ranks in Sentiment. You may stake up to 3 honor to reduce the TN by that amount (to a minimum of 1) to embellish the truth.</span></p><p><span class=\"fontstyle2\"><strong>Effects:</strong> </span><span class=\"fontstyle3\">If you succeed, you spread a powerful rumor of your foe’s weakness, of allies certain to arrive, or of some other hidden advantage that should ensure victory. The first time your target receives panic or strife during the next scene, they reduce the amount they receive by your ranks in Performance, to a minimum of 0. Whether you succeed or fail, if your side loses the battle, you lose your staked honor (as your boasts proved false). Additionally, there might be narrative social ramifications should individuals remember the lies you told.</span></p><h4><span class=\"fontstyle4\">New Opportunities</span></h4><p><span class=\"fontstyle5\">(air)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">If you fail, nobody remembers exactly what you said, so there are no narrative social consequences for your fabrication.</span></p><p><span class=\"fontstyle5\">(air)(op)</span><span class=\"fontstyle2\">: </span><span class=\"fontstyle3\">Add 1 kept (ring) set to (op) to the first Scheme action check you make during the next mass battle your army fights.</span></p>"
